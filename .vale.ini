# Prose checks for the documentation: `vale docs README.md src/sqlty/rules ...`.
# Styles are committed; `vale sync` refreshes them from Packages.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = SQLTy
Packages = Google, alex

[*.md]
BasedOnStyles = Vale, Google, alex

# The house style: sentence-case headings except names (rule names, products), no
# Oxford comma, and a capital after a colon when a sentence follows.
Google.Headings = NO
Google.OxfordComma = NO
Google.Colons = NO
# "above" and "application" read fine here, and `...` elides a list of types.
Google.WordListCase = NO
# The vocabulary lists accepted spellings, not the one casing to enforce.
Vale.Terms = NO
Google.Ellipses = NO

# Technical words alex reads as about people: "invalid SQL", "a hook", "reject".
alex.Ablist = NO
alex.ProfanityLikely = NO
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
