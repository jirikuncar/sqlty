[project]
site_name = "SQLTy"
site_description = "Type-safe SQL queries for Python with automatic type inference, source rewriting, and lint checks."
site_url = "https://jirikuncar.github.io/sqlty/"
repo_url = "https://github.com/jirikuncar/sqlty"
repo_name = "jirikuncar/sqlty"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# Abort `zensical build` on warnings (broken links/anchors are validated by default)
strict = true
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
    { "Why SQLTy?" = "motivation.md" },
    { "Use cases" = "use-cases.md" },
  ] },
  { "Guide" = [
    { "Writing queries" = "guide/writing-queries.md" },
    { "Schema inference" = "guide/schema-inference.md" },
    { "Name diagnostics" = "guide/name-diagnostics.md" },
    { "Breaking schema changes" = "guide/breaking-changes.md" },
    { "Drivers and ORMs" = "guide/drivers-and-orms.md" },
    { "Untyped queries" = "guide/untyped.md" },
    { "Row types" = "guide/row-types.md" },
    { "JSON shapes" = "guide/json-shapes.md" },
    { "Query helpers" = "guide/helpers.md" },
    { "Query parameters" = "guide/parameters.md" },
    { "psycopg" = "guide/psycopg.md" },
    { "Magic codec" = "guide/magic-codec.md" },
  ] },
  { "Recipes" = [
    { "Migration" = "recipes/migration.md" },
    { "CI and pre-commit" = "recipes/ci.md" },
    { "Coding agents" = "recipes/agents.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Rules" = "reference/rules.md" },
    { "Type mapping" = "reference/types.md" },
    { "Python API" = "reference/python-api.md" },
    { "Engine" = "reference/engine.md" },
  ] },
]

[project.theme]
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
