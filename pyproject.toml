[project]
name = "sqlty"
dynamic = ["version"]
description = "Type-safe SQL queries for Python with automatic stub generation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jiri Kuncar", email = "jiri.kuncar@gmail.com" }]
keywords = [
    "sql",
    "type-hints",
    "mypy",
    "type-safety",
    "static-analysis",
    "code-generation",
    "stub-files",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Programming Language :: SQL",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["asttokens>=3.0.0", "typing-extensions>=4.15.0; python_version < '3.15'"]

[project.urls]
Homepage = "https://github.com/jirikuncar/sqlty"
Documentation = "https://jirikuncar.github.io/sqlty/"
Repository = "https://github.com/jirikuncar/sqlty"
Changelog = "https://github.com/jirikuncar/sqlty/releases"
Issues = "https://github.com/jirikuncar/sqlty/issues"

[project.scripts]
sqlty = "sqlty._cli:main"

[project.optional-dependencies]
psycopg = ["psycopg>=3.2.12"]

[build-system]
requires = ["maturin>=1.12.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "sqlty._core"
features = ["pyo3/extension-module"]
manifest-path = "rust/crates/sqlty-ext/Cargo.toml"
# Ship the startup hook at the wheel root so it lands in site-packages and
# registers the lazy "sqlty" codec lookup (see docs/guide/magic-codec.md).
# The path is relative to the project root (maturin >= 1.12.1): the wheel gets
# it at the root (python-source prefix stripped), the sdist at src/.
include = ["src/sqlty_magic.pth"]

[dependency-groups]
dev = [
    "inline-snapshot>=0.15.0",
    "maturin>=1.12.1,<2.0",
    "mypy>=2.4.0",
    "pre-commit>=4.0.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
cli = ["rich>=13.0.0"]
psycopg = ["psycopg>=3.2.12"]

[tool.pytest.ini_options]
addopts = ["-p", "tests._mdtest.plugin", "--cov-report=term-missing", "--cov-report=html", "-v"]
pythonpath = ["."]
testpaths = ["tests", "docs", "src/sqlty/rules", "README.md"]
mdtest_paths = ["tests/mdtest", "docs", "src/sqlty/rules", "README.md"]
markers = [
    "e2e: end-to-end tests (subprocess + inline-snapshot)",
    "slow: slow tests that can be skipped with -m 'not slow'",
]

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
patch = ["subprocess"]
omit = ["tests/*", "examples/*"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.combine]
show_missing = true

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[tool.ty.environment]
# Python version will be inferred from requires-python
root = ["./src", "./examples"]

[tool.ty.src]
include = ["src", "examples"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Markdown code blocks are test data (mdtest, README) and must not be reformatted.
extend-exclude = ["tests/typechecks", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # nested if statements (can be more readable)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
