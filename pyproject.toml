[project]
name = "sqlty"
dynamic = ["version"]
description = "Type-safe raw SQL for Python: row and parameter types inferred from your SQL and schema, no ORM or database needed"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jiri Kuncar", email = "jiri.kuncar@gmail.com" }]
keywords = [
    "sql",
    "raw-sql",
    "type-safety",
    "type-checking",
    "type-hints",
    "static-analysis",
    "linter",
    "mypy",
    "pyright",
    "ty",
    "postgresql",
    "sqlite",
    "mysql",
    "psycopg",
    "migrations",
    "code-generation",
    "orm-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Programming Language :: SQL",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pathspec>=0.12.1",
    "typing-extensions>=4.15.0; python_version < '3.15'",
]

[project.urls]
Homepage = "https://sqlty.kuncar.dev/"
Documentation = "https://sqlty.kuncar.dev/"
Repository = "https://github.com/jirikuncar/sqlty"
Changelog = "https://github.com/jirikuncar/sqlty/releases"
Issues = "https://github.com/jirikuncar/sqlty/issues"

[project.scripts]
sqlty = "sqlty._cli:main"

[project.entry-points."pygments.lexers"]
sqlty = "sqlty.lexer:SQLTyLexer"

[project.optional-dependencies]
psycopg = ["psycopg>=3.2.12"]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "sqlty._core"
features = ["pyo3/extension-module"]
manifest-path = "rust/crates/sqlty-ext/Cargo.toml"
# Ship the startup hook at the wheel root so it lands in site-packages and
# registers the lazy "sqlty" codec lookup (see docs/guide/magic-codec.md).
# The path is relative to the project root (maturin >= 1.12.1): the wheel gets
# it at the root (python-source prefix stripped), the sdist at src/.
# The Agent Skills are compiled into the extension, so only the sdist needs them.
include = ["src/sqlty_magic.pth", { path = "skills/**/*", format = "sdist" }]

[dependency-groups]
dev = [
    "inline-snapshot>=0.15.0",
    "maturin>=1.15,<2.0",
    "mypy>=2.4.0",
    "prek>=0.5.4",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
    "pyyaml>=6.0.2",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    "rumdl>=0.3.0",
    "vale>=3.22.0.0",
    "zizmor>=1.31.1",
    "pydantic[email]>=2.14.1",
    "jsonschema>=4.26.0",
    "pytest-xdist>=3.8.0",
    "types-pygments>=2.19",
]
cli = ["rich>=15.0.0"]
# Only the DuckDB type tests need it, and it has no wheel for every Python.
duckdb = ["duckdb>=1.4.0"]
psycopg = ["psycopg>=3.2.12"]
# The aiosqlite calls sqlty checks, run against aiosqlite (tests/test_aiosqlite.py).
aiosqlite = ["aiosqlite>=0.22.1"]
fuzz = [
    "hypothesis>=6.140",
]
bench = [
    "pytest-codspeed>=5.0.3",
]

[tool.pytest.ini_options]
# In parallel and in random order; `make test-timing` runs the `timing` tests alone.
addopts = ["-p", "tests._mdtest.plugin", "-p", "tests._no_exec", "--cov-report=term-missing", "--cov-report=html", "-v", "-n", "auto", "-m", "not timing"]
pythonpath = ["."]
testpaths = ["tests", "docs", "src/sqlty/rules", "README.md"]
mdtest_paths = ["tests/mdtest", "docs", "src/sqlty/rules", "README.md", "skills"]
markers = [
    "e2e: end-to-end tests (subprocess + inline-snapshot)",
    "slow: slow tests that can be skipped with -m 'not slow'",
    "pg: needs a PostgreSQL server (SQLTY_PG_DSN); skipped without it",
    "timing: measures wall time, so runs alone: `make test-timing`",
]

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
patch = ["subprocess"]
omit = ["tests/*", "examples/*"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.combine]
show_missing = true

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[tool.ty.environment]
# Python version will be inferred from requires-python
root = ["./src", "./examples"]

[tool.ty.src]
include = ["src", "examples"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Markdown code blocks are test data (mdtest, README) and must not be reformatted.
extend-exclude = ["tests/typechecks", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # nested if statements (can be more readable)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.rumdl]
# Long lines are tables and links; spaces in code spans show `--sql ` on purpose.
disable = ["MD013", "MD038"]
exclude = ["site", ".vale", ".github", "tests", "scripts/compat/reports", "plans/2026-02-13-future.md", "rust/target", "proofs/.lake"]

[tool.rumdl.per-file-ignores]
# The logo and demo GIF need HTML for light/dark variants, width and centering.
"README.md" = ["MD033"]
# The editors and panels of the playground are HTML that its script fills in.
"docs/playground.md" = ["MD033"]
