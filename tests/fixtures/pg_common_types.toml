# The type PostgreSQL 17.10 gives each query's single column, as pg_type.typname.
# Generated by scripts/refresh_pg_types.py; add a query with any type, then run it.

[literals]
"SELECT '123'" = "text"
"SELECT 1" = "int4"
"SELECT 2147483648" = "int8"
"SELECT 9223372036854775808" = "numeric"
"SELECT 1.5" = "numeric"
