# sqlty requires Python >= 3.14: set `language_version: python3.14` on the hook
# or `default_language_version: {python: python3.14}` in .pre-commit-config.yaml.
# Rewrite and check work file by file, so pre-commit may run them in parallel.
- id: sqlty-rewrite
  name: sqlty rewrite
  description: Wrap --sql strings in SQL[T](...) calls in place
  entry: sqlty rewrite
  language: python
  types: [python]

- id: sqlty-check
  name: sqlty check
  description: Lint SQL[T] queries; fails only on error-severity rules (by default row type mismatches and SELECT * without a schema; drift such as stale-type is a warning)
  entry: sqlty check
  language: python
  types: [python]

# Deprecated alias of sqlty-rewrite, kept so existing configs using `id: sqlty` work.
# It used to generate stubs; it now rewrites the staged files in place.
- id: sqlty
  name: sqlty rewrite (deprecated id 'sqlty', use sqlty-rewrite)
  description: Deprecated alias of sqlty-rewrite (rewrites files in place; no longer generates stubs)
  entry: sqlty rewrite
  language: python
  types: [python]
