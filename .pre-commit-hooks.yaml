- id: sqlty
  name: sqlty stub generation
  description: Generate type stubs for SQL queries
  entry: sqlty
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true
  args: ["."]

- id: sqlty-check
  name: sqlty check
  description: Check that type stubs for SQL queries are up-to-date
  entry: sqlty
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true
  args: [".", "--check", "--verbose"]
