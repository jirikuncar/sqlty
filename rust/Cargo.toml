[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Rust engine of sqlty: SQL type inference and Python source rewriting"
license = "MIT"
repository = "https://github.com/jirikuncar/sqlty"
publish = false
rust-version = "1.88"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
sqlparser = { version = "0.63", features = ["visitor"] }
regex = "1"
rustc-hash = "2"
thiserror = "2"
sqlty-sql = { path = "crates/sqlty-sql" }
sqlty-python = { path = "crates/sqlty-python" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[workspace.lints.rust]
unused_lifetimes = "warn"
unused_qualifications = "warn"

# Wheels published to PyPI: `maturin build --profile dist`. Plain `release` (what `uv sync`
# and `maturin develop --release` use) stays quick to rebuild.
# No panic = "abort": PyO3 turns panics into Python exceptions.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
