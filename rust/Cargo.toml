[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2021"
description = "Rust engine of sqlty: SQL type inference and Python source rewriting"
license = "MIT"
repository = "https://github.com/jirikuncar/sqlty"
publish = false
rust-version = "1.99"

[workspace.dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
sqlparser = { version = "0.63", features = ["visitor"] }
regex = "1"
recursive = "0.1"
rustc-hash = "2"
thiserror = "2"
insta = "1.49"
toml = { version = "1.1", features = ["preserve_order"] }
sqlty-sql = { path = "crates/sqlty-sql" }
sqlty-python = { path = "crates/sqlty-python" }
sqlty-lsp = { path = "crates/sqlty-lsp" }
sqlty-format = { path = "crates/sqlty-format" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

# Most test time goes to sqlparser and pyo3: optimised, a serial `pytest -n 0` takes 40% less,
# and the workspace crates still build at debug speed.
[profile.dev.package."*"]
opt-level = 3

# Wheels published to PyPI: `maturin build --profile dist`. Plain `release` (what `uv sync`
# and `maturin develop --release` use) stays quick to rebuild.
# No panic = "abort": PyO3 turns panics into Python exceptions.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The docs playground's engine (`make playground`): a third of the bytes of `dist` to
# download, for about 1.6 times its analysis time, still well under a keystroke.
[profile.wasm]
inherits = "dist"
opt-level = "z"
