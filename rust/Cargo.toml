[package]
name = "sqlty-core"
version = "0.1.0"
edition = "2021"
description = "Rust engine of sqlty: SQL type inference and Python source rewriting"
license = "MIT"
repository = "https://github.com/jirikuncar/sqlty"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
sqlparser = { version = "0.63", features = ["visitor"] }
regex = "1"
once_cell = "1"
