[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Rust engine of sqlty: SQL type inference and Python source rewriting"
license = "MIT"
repository = "https://github.com/jirikuncar/sqlty"
publish = false
rust-version = "1.88"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
sqlparser = { version = "0.63", features = ["visitor"] }
regex = "1"
rustc-hash = "2"
sqlty-sql = { path = "crates/sqlty-sql" }
sqlty-python = { path = "crates/sqlty-python" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
