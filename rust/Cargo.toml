[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.1"
edition = "2021"
description = "Rust engine of sqlty: SQL type inference and Python source rewriting"
license = "MIT"
repository = "https://github.com/jirikuncar/sqlty"
publish = false
rust-version = "1.99"

[workspace.dependencies]
pyo3 = "0.30"
sqlparser = { version = "0.64", features = ["visitor"] }
regex = "1"
recursive = "0.1"
rustc-hash = "2"
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false }
thiserror = "2"
insta = "1.49"
toml = { version = "1.1", features = ["preserve_order"] }
ruff_python_ast = "=0.0.21"
ruff_python_parser = "=0.0.21"
ruff_text_size = "=0.0.21"
sqlty-rules = { path = "crates/sqlty-rules" }
sqlty-sql = { path = "crates/sqlty-sql" }
sqlty-python = { path = "crates/sqlty-python" }
sqlty-lsp = { path = "crates/sqlty-lsp" }
sqlty-format = { path = "crates/sqlty-format" }
sqlty-project = { path = "crates/sqlty-project" }
sqlty-cli = { path = "crates/sqlty-cli" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
exit = "warn"
fallible_impl_from = "warn"
get_unwrap = "warn"
mem_forget = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_used = "warn"
expect_used = "warn"
unnested_or_patterns = "warn"

[workspace.lints.rust]
missing_docs = "warn"
# Set by cargo-llvm-cov on nightly, for `#[coverage(off)]`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
unused_lifetimes = "warn"
unused_qualifications = "warn"

# Wheels published to PyPI: `maturin build --profile dist`. Plain `release` (what `uv sync`
# and `maturin develop --release` use) stays quick to rebuild.
# No panic = "abort": PyO3 turns panics into Python exceptions.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The docs playground's engine (`make playground`): a third of the bytes of `dist` to
# download, for about 1.6 times its analysis time, still well under a keystroke.
[profile.wasm]
inherits = "dist"
opt-level = "z"
