[package]
name = "sqlty"
version.workspace = true
edition.workspace = true
description = "Type-safe raw SQL for Python: row and parameter types inferred from your SQL and schema, no ORM or database needed"
readme = "../../../README.md"
keywords = ["sql", "python", "type-checker", "linter", "lsp"]
categories = ["command-line-utilities", "development-tools", "database"]
homepage = "https://sqlty.kuncar.dev"
include = ["/src", "/build.rs", "/embedded"]
license.workspace = true
repository.workspace = true
publish = true
rust-version.workspace = true

[lib]
name = "sqlty_cli"

[[bin]]
name = "sqlty"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
regex.workspace = true
sqlty-lsp.workspace = true
sqlty-python.workspace = true
sqlty-project.workspace = true
sqlty-sql.workspace = true
toml.workspace = true

# musl's allocator makes `check` about five times slower on all cores.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
trycmd = "1.2.1"
