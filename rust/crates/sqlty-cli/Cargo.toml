[package]
name = "sqlty-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sqlty"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2"
sqlty-lsp.workspace = true
sqlty-python.workspace = true
sqlty-project.workspace = true
sqlty-sql.workspace = true
toml.workspace = true

# musl's allocator makes `check` about five times slower on all cores.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
trycmd = "1.2.1"
