# The engine reads only what the host hands it: no files, processes or network.
disallowed-methods = [
    { path = "std::fs::read", reason = "the engine does no I/O" },
    { path = "std::fs::read_to_string", reason = "the engine does no I/O" },
    { path = "std::fs::read_dir", reason = "the engine does no I/O" },
    { path = "std::fs::write", reason = "the engine does no I/O" },
    { path = "std::fs::metadata", reason = "the engine does no I/O" },
    { path = "std::fs::exists", reason = "the engine does no I/O" },
    { path = "std::fs::canonicalize", reason = "the engine does no I/O" },
    { path = "std::fs::copy", reason = "the engine does no I/O" },
    { path = "std::fs::rename", reason = "the engine does no I/O" },
    { path = "std::fs::create_dir", reason = "the engine does no I/O" },
    { path = "std::fs::create_dir_all", reason = "the engine does no I/O" },
    { path = "std::fs::remove_file", reason = "the engine does no I/O" },
    { path = "std::fs::remove_dir", reason = "the engine does no I/O" },
    { path = "std::fs::remove_dir_all", reason = "the engine does no I/O" },
    { path = "std::path::Path::exists", reason = "the engine does no I/O" },
    { path = "std::path::Path::is_file", reason = "the engine does no I/O" },
    { path = "std::path::Path::is_dir", reason = "the engine does no I/O" },
    { path = "std::path::Path::metadata", reason = "the engine does no I/O" },
    { path = "std::path::Path::read_dir", reason = "the engine does no I/O" },
    { path = "std::path::Path::canonicalize", reason = "the engine does no I/O" },
    { path = "std::io::stdin", reason = "the engine does no I/O" },
    { path = "std::io::stdout", reason = "the engine does no I/O" },
    { path = "std::io::stderr", reason = "the engine does no I/O" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "the engine does no I/O" },
    { path = "std::fs::OpenOptions", reason = "the engine does no I/O" },
    { path = "std::process::Command", reason = "the engine spawns no process" },
    { path = "std::net::TcpStream", reason = "the engine does no network access" },
    { path = "std::net::TcpListener", reason = "the engine does no network access" },
    { path = "std::net::UdpSocket", reason = "the engine does no network access" },
]
