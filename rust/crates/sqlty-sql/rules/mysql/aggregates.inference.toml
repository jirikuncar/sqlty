# MySQL aggregate functions.

[[function]]
id = "mysql.aggregate.sum-exact"
function = "SUM"
dialects = ["mysql"]
argument = ["@integer", "DECIMAL", "NUMERIC", "@unsigned", "UDECIMAL", "YEAR", "BIT", "BOOLEAN", "@temporal"]
type = "DECIMAL"
nullability = "aggregate"
reference = "MySQL 8.4 Reference Manual, 14.19.1 Aggregate Function Descriptions (The SUM() and AVG() functions return a DECIMAL value for exact-value arguments (integer or DECIMAL); The SUM() and AVG() aggregate functions do not work with temporal values. (They convert the values to numbers, losing everything after the first nonnumeric character.))"
reasoning = "SUM of integers or decimals gives an exact DECIMAL, and so does SUM of `YEAR`, `BIT`, `BOOLEAN` or temporal values, which it converts to integers."

[[function]]
id = "mysql.aggregate.sum-approximate"
function = "SUM"
dialects = ["mysql"]
argument = ["FLOAT", "REAL", "DOUBLE", "UDOUBLE", "@text", "ENUM", "SET", "JSON"]
type = "DOUBLE"
nullability = "aggregate"
reference = "MySQL 8.4 Reference Manual, 14.19.1 Aggregate Function Descriptions (a DOUBLE value for approximate-value arguments (FLOAT or DOUBLE)); 14.3 Type Conversion in Expression Evaluation (MySQL automatically converts strings to numbers as necessary)"
reasoning = "SUM of floating-point values gives a DOUBLE, and so does SUM of strings, which it converts to doubles."

