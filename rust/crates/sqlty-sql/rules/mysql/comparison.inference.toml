# MySQL comparisons.

[[rule]]
id = "mysql.comparison.null-safe-equal"
operator = "Spaceship"
dialects = ["mysql"]
type = "BOOLEAN"
nullability = "non-null"
reference = "MySQL 8.4 Reference Manual, 14.4.2 Comparison Functions and Operators (<=>)"
reasoning = "`<=>` is NULL-safe equality: it gives 1 or 0, never NULL."
