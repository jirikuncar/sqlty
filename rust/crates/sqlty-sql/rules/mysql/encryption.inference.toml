# MySQL encryption and compression functions.

[[function]]
id = "mysql.encryption.text"
functions = ["MD5", "SHA", "SHA1", "SHA2"]
dialects = ["mysql"]
type = "TEXT"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.13 Encryption and Compression Functions"
reasoning = "The manual describes each of these as returning a string."

[[function]]
id = "mysql.encryption.varbinary"
functions = ["COMPRESS", "UNCOMPRESS", "AES_ENCRYPT", "RANDOM_BYTES"]
dialects = ["mysql"]
type = "VARBINARY"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.13 Encryption and Compression Functions"
reasoning = "The manual describes each of these as returning a binary string."

[[function]]
id = "mysql.encryption.varbinary-nullable"
function = "AES_DECRYPT"
dialects = ["mysql"]
type = "VARBINARY"
nullability = "nullable"
reference = "MySQL 8.4 Reference Manual, 14.13 Encryption and Compression Functions"
reasoning = "The manual describes each of these as returning a binary string. MySQL also returns NULL for a value it cannot read: a string that is not a valid date or time, an index out of range, or a number outside a math function's domain."

[[function]]
id = "mysql.encryption.digest"
functions = ["STATEMENT_DIGEST", "STATEMENT_DIGEST_TEXT"]
dialects = ["mysql"]
type = "TEXT"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.13 Encryption and Compression Functions (STATEMENT_DIGEST(), STATEMENT_DIGEST_TEXT(): If the argument is NULL, the function returns NULL)"
reasoning = "Each returns a digest of a statement as a string, and raises an error for one it cannot parse."

[[function]]
id = "mysql.encryption.int"
functions = ["UNCOMPRESSED_LENGTH", "VALIDATE_PASSWORD_STRENGTH"]
dialects = ["mysql"]
type = "INT"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.13 Encryption and Compression Functions"
reasoning = "Each returns an integer, a length or a strength from 0 to 100, and NULL for NULL."
