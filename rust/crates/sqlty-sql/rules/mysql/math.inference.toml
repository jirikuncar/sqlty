[[function]]
id = "mysql.math.double-nullable"
functions = ["SQRT", "LN", "LOG", "LOG2", "LOG10", "ACOS", "ASIN"]
dialects = ["mysql"]
type = "DOUBLE"
nullability = "nullable"
reference = "MySQL 8.4 Reference Manual, 14.6.2 Mathematical Functions"
reasoning = "The manual describes each of these as returning a DOUBLE. MySQL also returns NULL for a value it cannot read: a string that is not a valid date or time, an index out of range, or a number outside a math function's domain."

