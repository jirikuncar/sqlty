# MySQL division.

[[rule]]
id = "mysql.arithmetic.division"
operator = "Divide"
dialects = ["mysql"]
left = ["@numeric"]
right = ["@numeric"]
type = "@promote-decimal"
nullability = "nonzero-divisor"
reference = "MySQL 8.4 Reference Manual, 14.6.1 Arithmetic Operators (/ Division; Division by zero produces a NULL result)"
reasoning = "`/` on integers gives an exact decimal, and NULL for a zero divisor."

[[rule]]
id = "mysql.arithmetic.division-other"
operator = "Divide"
dialects = ["mysql"]
type = "@unknown"
nullability = "nonzero-divisor"
reference = "MySQL 8.4 Reference Manual, 14.6.1 Arithmetic Operators (Division by zero produces a NULL result)"
reasoning = "A division by zero gives NULL whatever the operand types."

[[rule]]
id = "mysql.arithmetic.integer-division"
operator = "MyIntegerDivide"
dialects = ["mysql"]
type = "BIGINT"
nullability = "nonzero-divisor"
reference = "MySQL 8.4 Reference Manual, 14.6.1 Arithmetic Operators (DIV; the operands are converted to DECIMAL and divided before converting the result to BIGINT; Division by zero produces a NULL result)"
reasoning = "`DIV` gives a BIGINT, and NULL for a zero divisor."

[[rule]]
id = "mysql.arithmetic.unsigned"
operators = ["Plus", "Minus", "Multiply"]
dialects = ["mysql"]
left = ["@unsigned"]
right = ["@integer", "@unsigned"]
type = "UBIGINT"
reference = "MySQL 8.4 Reference Manual, 14.6.1 Arithmetic Operators (If both operands are integers and any of them are unsigned, the result is an unsigned integer)"
reasoning = "Integer arithmetic with an unsigned operand is unsigned, at BIGINT precision."

[[rule]]
id = "mysql.arithmetic.unsigned-right"
operators = ["Plus", "Minus", "Multiply"]
dialects = ["mysql"]
left = ["@integer"]
right = ["@unsigned"]
type = "UBIGINT"
reference = "MySQL 8.4 Reference Manual, 14.6.1 Arithmetic Operators (If both operands are integers and any of them are unsigned, the result is an unsigned integer)"
reasoning = "Integer arithmetic with an unsigned operand is unsigned, at BIGINT precision."
