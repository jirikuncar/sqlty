# MySQL string functions over binary strings, and the result type of ROUND and TRUNCATE.

[[function]]
id = "mysql.string.binary"
functions = ["LPAD", "RPAD", "LEFT", "RIGHT", "REVERSE", "REPEAT", "UPPER", "LOWER", "UCASE", "LCASE", "CONCAT", "INSERT", "LTRIM", "RTRIM", "REPLACE", "REGEXP_REPLACE", "REGEXP_SUBSTR"]
dialects = ["mysql"]
argument = ["@binary"]
type = "VARBINARY"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.8 String Functions and Operators (CONCAT(): if the arguments include any binary strings, the result is a binary string)"
reasoning = "A string function of a binary string gives a binary string, which MySQL drivers return as bytes."

[[function]]
id = "mysql.aggregate.bit-binary"
functions = ["BIT_AND", "BIT_OR", "BIT_XOR"]
dialects = ["mysql"]
argument = ["@binary"]
type = "VARBINARY"
nullability = "aggregate"
reference = "MySQL 8.4 Reference Manual, 14.19.1 Aggregate Function Descriptions (BIT_AND(): binary-string arguments produce a binary string result)"
reasoning = "Over binary strings the bit aggregates work bytewise and give a binary string."

[[function]]
id = "mysql.numeric.round-integer"
