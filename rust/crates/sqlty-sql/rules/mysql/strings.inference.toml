dialects = ["mysql"]
argument = ["@integer"]
type = "BIGINT"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.6.2 Mathematical Functions (ROUND(): when the first argument is of any integer type, the return type is always BIGINT; TRUNCATE() follows the same rules)"
reasoning = "Rounding an integer gives a BIGINT."

[[function]]
id = "mysql.numeric.round-decimal"
functions = ["ROUND", "TRUNCATE"]
dialects = ["mysql"]
argument = ["DECIMAL", "NUMERIC", "UDECIMAL"]
type = "@argument"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.6.2 Mathematical Functions (ROUND(): when the first argument is a DECIMAL value, the return type is also DECIMAL; TRUNCATE() follows the same rules)"
reasoning = "Rounding a decimal gives a decimal."

[[function]]
id = "mysql.numeric.round-other"
functions = ["ROUND", "TRUNCATE"]
dialects = ["mysql"]
argument = ["@known"]
type = "DOUBLE"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.6.2 Mathematical Functions (ROUND(): when the first argument is of any floating-point type or of any non-numeric type, the return type is always DOUBLE; TRUNCATE() follows the same rules)"
