# MySQL spatial functions. MySQL returns NULL for an empty geometry, or one of the wrong
# kind, from the functions that measure, compare or take a part of a geometry.

[[function]]
id = "mysql.spatial.set-coordinate"
functions = ["ST_X", "ST_Y", "ST_LATITUDE", "ST_LONGITUDE", "ST_SRID"]
dialects = ["mysql"]
arguments = [[], ["@numeric"]]
type = "GEOMETRY"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.16.7.2 Point Property Functions (ST_X(p [, new_x_val]): with the optional second argument, returns a Point object like the first argument); 14.16.7.1 General Geometry Property Functions (ST_SRID(g [, srid]))"
reasoning = "With a second argument, these return the first argument's geometry with that coordinate or SRID set."

