# MySQL date and time functions.

[[function]]
id = "mysql.datetime.argument-type"
functions = ["SUBTIME", "ADDTIME"]
dialects = ["mysql"]
type = "@argument-type(0)"
nullability = "nullable"
reference = "MySQL 8.4 Reference Manual, 14.7 Date and Time Functions"
reasoning = "The result has the type of the first argument. MySQL also returns NULL for a value it cannot read: a string that is not a valid date or time, an index out of range, or a number outside a math function's domain."

[[function]]
