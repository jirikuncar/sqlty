functions = ["SUBDATE", "DATE_ADD", "DATE_SUB", "ADDDATE"]
dialects = ["mysql"]
type = "@date-add"
nullability = "nullable"
reference = "MySQL 8.4 Reference Manual, 14.7 Date and Time Functions"
reasoning = "Adding to a DATE gives a DATE for day units and a DATETIME for time units; a DATETIME stays one. MySQL also returns NULL for a value it cannot read: a string that is not a valid date or time, an index out of range, or a number outside a math function's domain."

