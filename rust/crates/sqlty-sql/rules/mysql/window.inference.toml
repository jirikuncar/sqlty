# MySQL window functions.

[[function]]
id = "mysql.window.argument"
functions = ["FIRST_VALUE", "LAST_VALUE", "NTH_VALUE", "LAG", "LEAD"]
dialects = ["mysql"]
type = "@same(0)"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.20.1 Window Function Descriptions"
reasoning = "The result is one of the first argument's values, so it keeps its type and values."

[[function]]
id = "mysql.window.double"
functions = ["PERCENT_RANK", "CUME_DIST"]
dialects = ["mysql"]
type = "DOUBLE"
nullability = "strict"
reference = "MySQL 8.4 Reference Manual, 14.20.1 Window Function Descriptions"
reasoning = "The manual describes each of these as returning a DOUBLE."
