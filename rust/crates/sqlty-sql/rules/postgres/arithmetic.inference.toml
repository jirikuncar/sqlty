# PostgreSQL arithmetic: reals, dates, times and intervals, addresses, division, bitwise
# and network operators.

[[rule]]
id = "postgres.arithmetic.reals"
operators = ["Plus", "Minus", "Multiply", "Divide", "Modulo"]
dialects = ["postgres"]
left = ["REAL", "FLOAT"]
right = ["REAL", "FLOAT"]
type = "@promote"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (numeric_type + numeric_type → numeric_type)"
reasoning = "Two reals give a real."

[[rule]]
id = "postgres.arithmetic.real-and-other"
operators = ["Plus", "Minus", "Multiply", "Divide", "Modulo"]
dialects = ["postgres"]
left = ["REAL", "FLOAT"]
right = ["@numeric"]
type = "DOUBLE"
reference = "PostgreSQL 17 documentation, 10.2 Operators, Example 10.1 (operators are resolved among the candidates a type converts to; real has operators only with real)"
reasoning = "PostgreSQL has real operators for two reals only, so a real with another number resolves to double precision."

[[rule]]
id = "postgres.arithmetic.other-and-real"
operators = ["Plus", "Minus", "Multiply", "Divide", "Modulo"]
dialects = ["postgres"]
left = ["@numeric"]
right = ["REAL", "FLOAT"]
type = "DOUBLE"
reference = "PostgreSQL 17 documentation, 10.2 Operators, Example 10.1 (operators are resolved among the candidates a type converts to; real has operators only with real)"
reasoning = "PostgreSQL has real operators for two reals only, so a real with another number resolves to double precision."

[[rule]]
id = "postgres.arithmetic.division"
operators = ["Divide", "Modulo"]
dialects = ["postgres"]
left = ["@numeric"]
right = ["@numeric"]
type = "@promote"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (numeric_type / numeric_type → numeric_type)"
reasoning = "Division gives the wider type; a zero divisor raises an error rather than giving NULL."

[[rule]]
id = "postgres.datetime.date-interval"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["DATE"]
right = ["INTERVAL"]
type = "TIMESTAMP"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + interval → timestamp, date - interval → timestamp)"
reasoning = "A date moved by an interval can land within a day, so it becomes a timestamp."

[[rule]]
id = "postgres.datetime.timestamp-interval"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["TIMESTAMP", "TIMESTAMPTZ", "TIME", "TIMETZ"]
right = ["INTERVAL"]
type = "@left"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp + interval → timestamp, time with time zone + interval → time with time zone)"
reasoning = "A timestamp or time moved by an interval keeps its type."

[[rule]]
id = "postgres.datetime.interval-date"
operator = "Plus"
dialects = ["postgres"]
left = ["INTERVAL"]
right = ["DATE"]
type = "TIMESTAMP"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + interval → timestamp; + is commutative)"
reasoning = "An interval added to a date gives a timestamp."

[[rule]]
id = "postgres.datetime.interval-timestamp"
operator = "Plus"
dialects = ["postgres"]
left = ["INTERVAL"]
right = ["TIMESTAMP", "TIMESTAMPTZ", "TIME", "TIMETZ"]
type = "@right"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp + interval → timestamp; + is commutative)"
reasoning = "An interval added to a timestamp or time keeps its type."

[[rule]]
id = "postgres.datetime.date-days"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["DATE"]
right = ["SMALLINT", "INT"]
type = "DATE"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + integer → date, date - integer → date)"
reasoning = "Whole days added to or taken from a date give a date."

[[rule]]
id = "postgres.datetime.days-date"
operator = "Plus"
dialects = ["postgres"]
left = ["SMALLINT", "INT"]
right = ["DATE"]
type = "DATE"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + integer → date; + is commutative)"
reasoning = "Whole days added to a date give a date."

[[rule]]
id = "postgres.datetime.date-time"
operator = "Plus"
dialects = ["postgres"]
left = ["DATE"]
right = ["TIME"]
type = "TIMESTAMP"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + time → timestamp)"
reasoning = "A date and a time of day make a timestamp."

[[rule]]
id = "postgres.datetime.time-date"
operator = "Plus"
dialects = ["postgres"]
left = ["TIME"]
right = ["DATE"]
type = "TIMESTAMP"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + time → timestamp; + is commutative)"
reasoning = "A time of day and a date make a timestamp."

[[rule]]
id = "postgres.datetime.date-timetz"
operator = "Plus"
dialects = ["postgres"]
left = ["DATE"]
right = ["TIMETZ"]
type = "TIMESTAMPTZ"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + time with time zone → timestamp with time zone)"
reasoning = "A date and a time with time zone make a timestamp with time zone."

[[rule]]
id = "postgres.datetime.timetz-date"
operator = "Plus"
dialects = ["postgres"]
left = ["TIMETZ"]
right = ["DATE"]
type = "TIMESTAMPTZ"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date + time with time zone → timestamp with time zone; + is commutative)"
reasoning = "A time with time zone and a date make a timestamp with time zone."

[[rule]]
id = "postgres.datetime.date-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["DATE"]
right = ["DATE"]
type = "INT"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (date - date → integer)"
reasoning = "Subtracting dates counts the days between them."

[[rule]]
id = "postgres.datetime.time-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["TIME"]
right = ["TIME"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (time - time → interval)"
reasoning = "Subtracting times of day gives an interval."

[[rule]]
id = "postgres.datetime.timestamp-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["TIMESTAMP"]
right = ["TIMESTAMP"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp - timestamp → interval)"
reasoning = "Subtracting timestamps gives an interval."

[[rule]]
id = "postgres.datetime.timestamptz-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["TIMESTAMPTZ"]
right = ["TIMESTAMPTZ"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp - timestamp → interval)"
reasoning = "Subtracting timestamps with time zone gives an interval."

[[rule]]
id = "postgres.datetime.timestamp-date-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["TIMESTAMP", "TIMESTAMPTZ"]
right = ["DATE"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp - timestamp → interval); 10.2 Operators (an implicit cast, here date to timestamp, picks that operator)"
reasoning = "The date converts to a timestamp, so the difference is an interval."

[[rule]]
id = "postgres.datetime.date-timestamp-difference"
operator = "Minus"
dialects = ["postgres"]
left = ["DATE"]
right = ["TIMESTAMP", "TIMESTAMPTZ"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (timestamp - timestamp → interval); 10.2 Operators (an implicit cast, here date to timestamp, picks that operator)"
reasoning = "The date converts to a timestamp, so the difference is an interval."

[[rule]]
id = "postgres.datetime.intervals"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["INTERVAL"]
right = ["INTERVAL"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (interval + interval → interval, interval - interval → interval)"
reasoning = "Adding or subtracting intervals gives an interval."

[[rule]]
id = "postgres.datetime.interval-scaled"
operators = ["Multiply", "Divide"]
dialects = ["postgres"]
left = ["INTERVAL"]
right = ["@numeric"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (interval * double precision → interval, interval / double precision → interval)"
reasoning = "Scaling an interval by a number gives an interval."

[[rule]]
id = "postgres.datetime.scaled-interval"
operator = "Multiply"
dialects = ["postgres"]
left = ["@numeric"]
right = ["INTERVAL"]
type = "INTERVAL"
reference = "PostgreSQL 17 documentation, 9.9, Table 9.32 Date/Time Operators (double precision * interval → interval)"
reasoning = "Scaling an interval by a number gives an interval."

[[rule]]
id = "postgres.network.difference"
operator = "Minus"
dialects = ["postgres"]
left = ["@address"]
right = ["@address"]
type = "BIGINT"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet - inet → bigint)"
reasoning = "The difference of two addresses is a count."

[[rule]]
id = "postgres.network.offset"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["@address"]
right = ["@integer"]
type = "INET"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet + bigint → inet, inet - bigint → inet)"
reasoning = "An address moved by an offset is an address."

[[rule]]
id = "postgres.network.offset-left"
operator = "Plus"
dialects = ["postgres"]
left = ["@integer"]
right = ["@address"]
type = "INET"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (bigint + inet → inet)"
reasoning = "An offset added to an address is an address."

[[rule]]
id = "postgres.money.amount"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["MONEY"]
right = ["MONEY"]
type = "MONEY"
reference = "PostgreSQL 17 documentation, 8.2 Monetary Types"
reasoning = "The sum or difference of two amounts is an amount."

[[rule]]
id = "postgres.money.ratio"
operator = "Divide"
dialects = ["postgres"]
left = ["MONEY"]
right = ["MONEY"]
type = "DOUBLE"
reference = "PostgreSQL 17 documentation, 8.2 Monetary Types (a money value divided by another money value is double precision)"
reasoning = "Dividing an amount by an amount cancels the currency and gives a double."

[[rule]]
id = "postgres.money.scaled"
operators = ["Multiply", "Divide"]
dialects = ["postgres"]
left = ["MONEY"]
right = ["@numeric"]
type = "MONEY"
reference = "PostgreSQL 17 documentation, 8.2 Monetary Types (a money value divided by an integer is truncated toward zero)"
reasoning = "An amount multiplied or divided by a number is an amount."

[[rule]]
id = "postgres.money.scaled-right"
operator = "Multiply"
dialects = ["postgres"]
left = ["@numeric"]
right = ["MONEY"]
type = "MONEY"
reference = "PostgreSQL 17 documentation, 8.2 Monetary Types"
reasoning = "A number multiplied by an amount is an amount."

[[rule]]
id = "postgres.lsn.difference"
operator = "Minus"
dialects = ["postgres"]
left = ["PG_LSN"]
right = ["PG_LSN"]
type = "DECIMAL"
reference = "PostgreSQL 17 documentation, 8.20 pg_lsn Type (two LSNs subtracted give the number of bytes separating them)"
reasoning = "The distance between two write-ahead log locations is a byte count, a numeric."

[[rule]]
id = "postgres.lsn.offset"
operators = ["Plus", "Minus"]
dialects = ["postgres"]
left = ["PG_LSN"]
right = ["@integer", "DECIMAL", "NUMERIC"]
type = "PG_LSN"
reference = "PostgreSQL 17 documentation, 8.20 pg_lsn Type (+(pg_lsn,numeric) and -(pg_lsn,numeric))"
reasoning = "A location moved by a number of bytes is a location."

[[rule]]
id = "postgres.lsn.offset-left"
operator = "Plus"
dialects = ["postgres"]
left = ["@integer", "DECIMAL", "NUMERIC"]
right = ["PG_LSN"]
type = "PG_LSN"
reference = "PostgreSQL 17 documentation, 8.20 pg_lsn Type (+(pg_lsn,numeric))"
reasoning = "A number of bytes added to a location is a location."

[[rule]]
id = "postgres.geometry.path-concatenation"
operator = "Plus"
dialects = ["postgres"]
left = ["PATH"]
right = ["PATH"]
type = "PATH"
nullability = "nullable"
reference = "PostgreSQL 17 documentation, 9.11, Table 9.36 Geometric Operators (path + path → path)"
reasoning = "Two open paths concatenate into a path, and a closed one gives NULL."

[[rule]]
id = "postgres.geometry.translate"
operators = ["Plus", "Minus", "Multiply", "Divide"]
dialects = ["postgres"]
left = ["BOX", "CIRCLE", "PATH", "POINT"]
right = ["POINT"]
type = "@left"
reference = "PostgreSQL 17 documentation, 9.11, Table 9.36 Geometric Operators (geometric_type + point → geometric_type, and -, *, /)"
reasoning = "Translating, scaling or rotating a shape by a point keeps its type."

[[rule]]
id = "postgres.math.roots"
operators = ["Prefix:PGSquareRoot", "Prefix:PGCubeRoot"]
dialects = ["postgres"]
type = "DOUBLE"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (|/ double precision → double precision, ||/ double precision → double precision)"
reasoning = "Square and cube roots take and give a double."

[[rule]]
id = "postgres.arithmetic.division-other"
operators = ["Divide", "Modulo"]
dialects = ["postgres"]
type = "@unknown"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (numeric_type / numeric_type; division by zero raises an error)"
reasoning = "A zero divisor raises an error, so the result is NULL only when an operand is; other operand types have no known result."

[[rule]]
id = "postgres.bitwise.address-shift"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
left = ["@address"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet << inet → boolean, inet >> inet → boolean)"
reasoning = "On addresses, `<<` and `>>` test whether one network contains the other."

[[rule]]
id = "postgres.bitwise.address-shift-right-operand"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
right = ["@address"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet << inet → boolean, inet >> inet → boolean)"
reasoning = "On addresses, `<<` and `>>` test whether one network contains the other."

[[rule]]
id = "postgres.bitwise.address-mask"
operators = ["BitwiseAnd", "BitwiseOr", "PGBitwiseXor"]
dialects = ["postgres"]
left = ["@address"]
type = "INET"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet & inet → inet, inet | inet → inet)"
reasoning = "On addresses, `&` and `|` mask one address with another."

[[rule]]
id = "postgres.bitwise.address-mask-right-operand"
operators = ["BitwiseAnd", "BitwiseOr", "PGBitwiseXor"]
dialects = ["postgres"]
right = ["@address"]
type = "INET"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet & inet → inet, inet | inet → inet)"
reasoning = "On addresses, `&` and `|` mask one address with another."

[[rule]]
id = "postgres.bitwise.bits"
operators = ["BitwiseAnd", "BitwiseOr", "PGBitwiseXor"]
dialects = ["postgres"]
left = ["BIT", "VARBIT"]
right = ["BIT", "VARBIT"]
type = "BIT"
reference = "PostgreSQL 17 documentation, 9.6, Table 9.14 Bit String Operators (bit & bit → bit, bit | bit → bit, bit # bit → bit)"
reasoning = "Bitwise operators on bit strings of equal length give a bit string."

[[rule]]
id = "postgres.bitwise.bits-shift"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
left = ["BIT", "VARBIT"]
right = ["@integer"]
type = "BIT"
reference = "PostgreSQL 17 documentation, 9.6, Table 9.14 Bit String Operators (bit << integer → bit, bit >> integer → bit)"
reasoning = "A shifted bit string keeps its length."

[[rule]]
id = "postgres.bitwise.mac-addresses"
operators = ["BitwiseAnd", "BitwiseOr"]
dialects = ["postgres"]
left = ["MACADDR", "MACADDR8"]
right = ["MACADDR", "MACADDR8"]
type = "@left"
reference = "PostgreSQL 17 documentation, 9.12 Network Address Functions and Operators (macaddr and macaddr8 support the bitwise logical operators ~, & and |)"
reasoning = "Masking a MAC address with another gives a MAC address."

[[rule]]
id = "postgres.range.strictly-left-right"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
left = ["@range", "@multirange"]
right = ["@range", "@multirange"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.20, Table 9.56 Range Operators and Table 9.57 Multirange Operators (anyrange << anyrange → boolean, anyrange >> anyrange → boolean)"
reasoning = "On ranges and multiranges, `<<` and `>>` test whether one is strictly left or right of the other."

[[rule]]
id = "postgres.range.multirange-set-operations"
operators = ["Plus", "Minus", "Multiply"]
dialects = ["postgres"]
left = ["@multirange"]
right = ["@multirange"]
type = "@left"
reference = "PostgreSQL 17 documentation, 9.20, Table 9.57 Multirange Operators (anymultirange + anymultirange → anymultirange, and *, -)"
reasoning = "The union, intersection and difference of two multiranges are a multirange of their type."

[[rule]]
id = "postgres.geometry.side"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
left = ["BOX", "CIRCLE", "POINT", "POLYGON"]
right = ["BOX", "CIRCLE", "POINT", "POLYGON"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.11, Table 9.36 Geometric Operators (geometric_type << geometric_type → boolean, geometric_type >> geometric_type → boolean)"
reasoning = "On shapes, `<<` and `>>` test whether one is strictly left or right of the other."

[[rule]]
id = "postgres.bitwise.integers"
operators = ["BitwiseAnd", "BitwiseOr", "PGBitwiseXor"]
dialects = ["postgres"]
left = ["@integer"]
right = ["@integer"]
type = "@promote"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (integral_type & integral_type → integral_type)"
reasoning = "Bitwise operators on integers give the wider integer type."

[[rule]]
id = "postgres.bitwise.shift"
operators = ["PGBitwiseShiftLeft", "PGBitwiseShiftRight"]
dialects = ["postgres"]
left = ["@integer"]
right = ["@integer"]
type = "@promote-left"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (integral_type << integer → integral_type)"
reasoning = "A shift keeps the type of the number it shifts."

[[rule]]
id = "postgres.network.contained-or-equal"
operators = ["Custom:<<=", "Custom:>>="]
dialects = ["postgres"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.12, Table 9.39 IP Address Operators (inet <<= inet → boolean, inet >>= inet → boolean)"
reasoning = "`<<=` and `>>=` test whether one network contains or equals the other."

[[rule]]
id = "postgres.range.adjacency"
operators = ["Custom:-|-", "AndLt", "AndGt"]
dialects = ["postgres"]
type = "BOOLEAN"
reference = "PostgreSQL 17 documentation, 9.20, Table 9.56 Range Operators (anyrange -|- anyrange → boolean, anyrange &< anyrange → boolean, anyrange &> anyrange → boolean)"
reasoning = "Range adjacency and extent tests are predicates."

[[rule]]
id = "postgres.range.set-operations"
operators = ["Plus", "Minus", "Multiply"]
dialects = ["postgres"]
left = ["@range"]
right = ["@range"]
type = "@left"
reference = "PostgreSQL 17 documentation, 9.20, Table 9.56 Range Operators (anyrange + anyrange → anyrange, anyrange * anyrange → anyrange, anyrange - anyrange → anyrange)"
reasoning = "The union, intersection and difference of two ranges are a range of their type."

[[rule]]
id = "postgres.bitwise.not"
operator = "Prefix:BitwiseNot"
dialects = ["postgres"]
type = "@right"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (~ integral_type → integral_type), 9.6, Table 9.14 Bit String Operators (~ bit → bit), 9.12, Table 9.39 IP Address Operators (~ inet → inet)"
reasoning = "`~` inverts the bits of an integer, a bit string or an address and keeps its type."

[[rule]]
id = "postgres.math.absolute"
operator = "Prefix:PGAbs"
dialects = ["postgres"]
type = "@right"
reference = "PostgreSQL 17 documentation, 9.3, Table 9.4 Mathematical Operators (@ numeric_type → numeric_type)"
reasoning = "`@` is the absolute value, of the operand's type."
