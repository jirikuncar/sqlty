# PostgreSQL window functions.

[[function]]
id = "postgres.window.argument"
functions = ["FIRST_VALUE", "LAST_VALUE", "NTH_VALUE", "LAG", "LEAD"]
dialects = ["postgres"]
type = "@same(0)"
nullability = "strict"
reference = "PostgreSQL 17 documentation, 9.22 Window Functions, Table 9.65 General-Purpose Window Functions"
reasoning = "The result is one of the first argument's values, so it keeps its type and values."
