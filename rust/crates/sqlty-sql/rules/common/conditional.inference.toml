# Every dialect's conditional expressions.

[[function]]
id = "common.conditional.common"
function = "COALESCE"
type = "@first-known"
nullability = "strict"
reference = "PostgreSQL 17 documentation, 9.18.2 COALESCE"
reasoning = "The arguments resolve to one common type, the first known argument's."

[[function]]
id = "common.conditional.nullif"
function = "NULLIF"
type = "@same(0)"
nullability = "strict"
reference = "PostgreSQL 17 documentation, 9.18.3 NULLIF; MySQL 8.4 Reference Manual, 14.5 Flow Control Functions; SQLite documentation, Built-In Scalar SQL Functions"
reasoning = "The result is the first argument or NULL, so it keeps its type and values."
