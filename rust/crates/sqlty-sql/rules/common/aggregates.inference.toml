functions = ["STDDEV", "STDDEV_POP", "STDDEV_SAMP", "VARIANCE", "VAR_POP", "VAR_SAMP"]
type = "DOUBLE"
nullability = "aggregate"
reference = "PostgreSQL 17 documentation, 9.21 Aggregate Functions, Table 9.61 Aggregate Functions for Statistics"
reasoning = "The documentation gives each of these a `double precision` result."

