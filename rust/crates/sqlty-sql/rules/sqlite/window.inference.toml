# SQLite window functions.

[[function]]
id = "sqlite.window.argument"
functions = ["FIRST_VALUE", "LAST_VALUE", "NTH_VALUE", "LAG", "LEAD"]
dialects = ["sqlite"]
type = "@same(0)"
nullability = "strict"
reference = "SQLite documentation, Window Functions"
reasoning = "The result is one of the first argument's values, so it keeps its type and values."

[[function]]
id = "sqlite.window.double"
functions = ["PERCENT_RANK", "CUME_DIST"]
