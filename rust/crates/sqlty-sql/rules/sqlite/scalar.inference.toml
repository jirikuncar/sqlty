[[function]]
id = "sqlite.scalar.blob-nullable"
function = "UNHEX"
dialects = ["sqlite"]
type = "BLOB"
nullability = "nullable"
reference = "SQLite documentation, Built-In Scalar SQL Functions"
reasoning = "Each of these returns a BLOB. SQLite also returns NULL for a value it cannot read: text that is not a date or not hexadecimal, or a number outside a math function's domain."

