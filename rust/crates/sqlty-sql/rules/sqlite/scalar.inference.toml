# SQLite core scalar functions.

[[function]]
id = "sqlite.scalar.branches"
function = "IIF"
dialects = ["sqlite"]
type = "@first-known(1)"
nullability = "code"
reference = "SQLite documentation, Built-In Scalar SQL Functions"
reasoning = "The result is one of the branches, from the second argument on, resolved to their common type. Its nullability depends on the window frame or the condition, which `analyzer/nullability.rs` reads."

[[function]]
id = "sqlite.scalar.common"
function = "IFNULL"
dialects = ["sqlite"]
type = "@first-known"
nullability = "all-arguments"
reference = "SQLite documentation, Built-In Scalar SQL Functions"
reasoning = "The arguments resolve to one common type, the first known argument's. It skips NULL arguments, so it is NULL only when every argument is."

[[function]]
id = "sqlite.scalar.argument"
functions = ["LIKELIHOOD", "LIKELY", "UNLIKELY"]
dialects = ["sqlite"]
type = "@same(0)"
nullability = "strict"
reference = "SQLite documentation, Built-In Scalar SQL Functions"
reasoning = "The result is one of the first argument's values, so it keeps its type and values."

