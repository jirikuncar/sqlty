# SQLite date and time functions.

[[function]]
id = "sqlite.datetime.bigint"
function = "UNIXEPOCH"
dialects = ["sqlite"]
type = "BIGINT"
nullability = "code"
reference = "SQLite documentation, Date And Time Functions"
reasoning = "The function returns an integer. SQLite also returns NULL for a time value or modifier it cannot read. With no argument, or `'now'` alone, it reads the current time and is never NULL; `analyzer/nullability.rs` checks the arguments."

