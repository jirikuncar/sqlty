dialects = ["sqlite"]
type = "BIGINT"
nullability = "nullable"
reference = "SQLite documentation, Date And Time Functions"
reasoning = "The function returns an integer. SQLite also returns NULL for a value it cannot read: text that is not a date or not hexadecimal, or a number outside a math function's domain."

