[package]
name = "sqlty-core"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3t-py315"] }
rayon = "1.12"
sqlty-sql.workspace = true
sqlty-python.workspace = true
ruff_python_ast.workspace = true
ruff_text_size.workspace = true
sqlty-lsp.workspace = true
sqlty-format.workspace = true
sqlty-project.workspace = true
sqlty-cli.workspace = true
recursive.workspace = true
stacker = "0.1"
thiserror.workspace = true
toml.workspace = true

# Linux only: on macOS mimalloc v3 keeps its heap in fixed pthread slots that another
# copy in the same process would share. The extension is dlopen()ed, and initial-exec
# TLS fails to load on musl.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[build-dependencies]
pyo3-build-config = "0.30"

[dev-dependencies]
ruff_python_parser.workspace = true
