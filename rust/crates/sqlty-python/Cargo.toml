[package]
name = "sqlty-python"
version.workspace = true
edition.workspace = true
description = "Python source tokenizing, rewriting and linting for sqlty"
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true
ruff_text_size.workspace = true
recursive.workspace = true
stacker = "0.1"
sqlty-rules.workspace = true
sqlty-sql.workspace = true
regex.workspace = true
thiserror.workspace = true
toml.workspace = true
ignore = { version = "0.4", default-features = false }

[features]
# Prototype (plans/2026-11-20-typed-receivers.md, option C): a host may install a resolver
# that gives the method a call resolves to; `sqlty-project` installs one built on ty.
ty-receivers = []
