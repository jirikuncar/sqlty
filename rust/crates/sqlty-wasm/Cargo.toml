[package]
name = "sqlty-wasm"
version.workspace = true
edition.workspace = true
description = "The sqlty engine for the browser: what the docs playground runs"
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml.workspace = true
sqlty-sql.workspace = true
sqlty-python.workspace = true
sqlty-format = { workspace = true, optional = true }

[features]
default = ["sqruff"]
# `format` and the `sqruff` rule; without it the module is about a quarter smaller.
sqruff = ["dep:sqlty-format"]
