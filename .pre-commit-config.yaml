# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: [--scripts-are-modules, src]
        language: system
        pass_filenames: false
        require_serial: true
        types: [file, python]
      - id: sqlty-examples
        name: sqlty stub generation for examples
        entry: uv run sqlty examples --format-command "uv run ruff format --stdin-filename {filename}"
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]
        files: ^examples/
      - id: sqlty-check-examples
        name: sqlty check for examples
        entry: uv run sqlty examples --check --verbose
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]
        files: ^examples/


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        exclude: ^examples/magic_codec/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: fix-byte-order-marker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        # TODO remove when empty line issues in examples are fixed
        exclude: ^examples/
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.6
    hooks:
      # Update the uv lockfile
      - id: uv-lock
