# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: [--scripts-are-modules, src]
        language: system
        pass_filenames: false
        require_serial: true
        types: [file, python]
      - id: ty
        name: ty
        entry: uv run ty check src/sqlty
        language: system
        pass_filenames: false
        require_serial: true
        types: [file, python]
      - id: sqlty-check
        name: sqlty check examples
        entry: uv run sqlty check examples/
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]
        files: ^examples/
      # magic_codec/ keeps plain --sql strings: the codec wraps them at import time
      - id: sqlty-rewrite
        name: sqlty rewrite examples
        entry: >-
          uv run sqlty rewrite examples/01_quick_start examples/02_schema_inference
          examples/03_pyproject_config examples/04_check_and_types examples/05_import_style
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]
        files: ^examples/
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --check
        language: system
        pass_filenames: false
        types: [rust]


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        exclude: ^examples/magic_codec/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: fix-byte-order-marker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        # TODO remove when empty line issues in examples are fixed
        exclude: ^examples/
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.24
    hooks:
      # Update the uv lockfile
      - id: uv-lock
