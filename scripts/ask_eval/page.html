<!doctype html>
<meta charset="utf-8">
<title>ask eval</title>
<script type="module">
  import { load } from "/playground/engine.js";
  import { MODELS, answer, loadModel, wllama } from "/playground/ask.js";

  window.evaluate = async ({ model: id, repairs, threads }) => {
    const engine = await load(await (await fetch("/playground/sqlty_wasm.wasm")).arrayBuffer());
    const { schemas, questions } = await (await fetch("/eval/questions.json")).json();
    const model = MODELS.find((found) => found.id === id);
    const instance = await wllama({ wasm: "/wllama/wasm/wllama.wasm", module: "/wllama/index.js" });
    let started = performance.now();
    const complete = await loadModel(instance, model, { url: `/models/${model.file}`, n_threads: threads });
    const loadSeconds = (performance.now() - started) / 1000;
    const answers = [];
    for (const item of questions) {
      started = performance.now();
      const found = await answer({ complete, engine, schema: schemas[item.schema], dialect: "postgres", question: item.question, repairs });
      answers.push({ ...item, ...found, seconds: (performance.now() - started) / 1000 });
    }
    return { model: id, crossOriginIsolated: self.crossOriginIsolated, threads: navigator.hardwareConcurrency, loadSeconds, answers };
  };
</script>
