# The packages scripts/compat/ compares sqlty with, pinned so a new release shows up as a
# Dependabot pull request, which reruns the comparisons (.github/workflows/compat.yml).
# Not published; `run.sh <source>` installs a group next to sqlty.
[project]
name = "sqlty-compat"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
sqlalchemy = ["sqlalchemy==2.0.43"]
drivers = [
    "psycopg==3.3.2",
    "psycopg2-binary==2.9.11",
    "asyncpg==0.31.0",
    "pymysql==1.1.2",
    "mysqlclient==2.3.0",
    "aiosqlite==0.22.1",
]
sqlglot = ["sqlglot==30.23.0", "psycopg==3.3.2", "pymysql==1.1.2"]
django = ["django==6.1.2", "psycopg==3.3.2", "mysqlclient==2.3.0"]
tortoise = ["tortoise-orm==1.1.9"]
sqlmodel = ["sqlmodel==0.0.48"]
piccolo = ["piccolo==1.36.0"]
ormar = ["ormar==0.26.0"]
peewee = ["peewee==4.5.3"]
pony = ["pony==0.7.20", "psycopg2-binary==2.9.11", "pymysql==1.1.2"]
sqlobject = ["sqlobject==3.14.0"]
