name: Fuzz

# On demand: random schemas and queries through the analyzer, compared with PostgreSQL.
on:
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property
        default: "2000"
      seed:
        description: Hypothesis seed (empty for a random one)
        default: ""

permissions:
  contents: read

# `uv run` must not sync: that would build the extension again, through the release profile.
env:
  UV_NO_SYNC: "1"

jobs:
  fuzz:
    name: Fuzz the analyzer
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      SQLTY_FUZZ: "1"
      SQLTY_FUZZ_EXAMPLES: ${{ inputs.examples }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
        run: uv run pytest tests/test_fuzz.py -p no:randomly -q ${SEED:+"--hypothesis-seed=$SEED"}
