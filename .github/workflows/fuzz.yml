name: Fuzz

# On demand: the property tests of rust/fuzz, the analyzer compared with PostgreSQL among them.
on:
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property
        default: "2000"
      seed:
        description: Seed (PROPTEST_RNG_SEED, empty for a random one)
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz the analyzer
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      SQLTY_FUZZ_EXAMPLES: ${{ inputs.examples }}
      SQLTY_FUZZ_PYTHON: ${{ github.workspace }}/.venv/bin/python
      SQLTY_FUZZ_STATS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      # Rewritten code runs against this checkout's `sqlty` package, without the extension.
      - name: Install the dependencies
        run: uv sync --no-install-project --no-dev --extra psycopg

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1

      - name: Build the property tests
        run: cargo test --release --manifest-path rust/fuzz/Cargo.toml --test properties --no-run

      - name: Fuzz
        env:
          PROPTEST_RNG_SEED: ${{ inputs.seed }}
        run: >-
          cargo test --release --manifest-path rust/fuzz/Cargo.toml --test properties
          -- --nocapture
