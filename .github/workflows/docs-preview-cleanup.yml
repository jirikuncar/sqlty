# Deletes a pull request's docs Preview (the Preview job of docs.yml) when it closes.
# Checks out nothing: only the pull request number reaches the command.
name: Docs preview cleanup

on:
  pull_request:
    types: [closed]
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "wrangler.jsonc"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-preview-cleanup.yml"

permissions: {}

jobs:
  delete:
    name: Delete
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: docs-preview
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Delete the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! out=$(npx --yes wrangler@4.158.0 preview delete --worker-name sqlty --name "pr-$NUMBER" --skip-confirmation 2>&1); then
            grep -qi "not found" <<<"$out" || { echo "$out" >&2; exit 1; }
            echo "No Preview pr-$NUMBER to delete"
          fi
