name: Search check

# Where SQLTy shows up in search (scripts/search/check.py). On demand only; each source
# runs when its secret is set. Results and screenshots are kept as the `search-check` artifact.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of Search Console and Bing Webmaster stats
        default: "28"
      pages:
        description: Also scrape result pages (best effort, often blocked on runners)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  search:
    name: Search check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install Chromium
        if: inputs.pages
        run: uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell

      - name: Check search
        env:
          DAYS: ${{ inputs.days }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NO_PAGES: ${{ !inputs.pages && '--no-pages' || '' }}
        run: >-
          uvx --python 3.13 --with google-auth --with requests --with playwright==1.64.1
          python scripts/search/check.py --summary "$GITHUB_STEP_SUMMARY" $NO_PAGES

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: search-check
          path: search-check/
          retention-days: 90
