name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypi.yml
      - npm/**
      - pyproject.toml
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/**
      - scripts/package_binaries.py
  pull_request:
    paths:
      - .github/workflows/pypi.yml
      - npm/**
      - pyproject.toml
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/**
      - scripts/package_binaries.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# sqlty needs its compiled extension, so every supported platform gets a wheel;
# other platforms build from the sdist with a Rust toolchain.
jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds in the pypa images, which ship every CPython release.
          - os: ubuntu-latest
            target: x86_64
            pr: true
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: windows-latest
            target: x64
          - os: windows-11-arm
            target: aarch64
      fail-fast: false

    # A pull request builds the Linux x86_64 wheel only; a push to main, a release, or a
    # run by hand builds all of them, so main catches a macOS or Windows break before a release.
    env:
      SKIP: ${{ github.event_name == 'pull_request' && !matrix.pr }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the supported Pythons
        if: env.SKIP != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.14
            3.15
            3.15t

      - name: Build wheels
        if: env.SKIP != 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # Host builds otherwise use the runner image's rustc, which can lag the MSRV.
          rust-toolchain: 1.99.1
          # --find-interpreter would skip 3.14 under abi3t-py315; the 3.15 build covers 3.15t and later.
          # A pull request builds the abi3t wheel only.
          args: >-
            --profile dist --out dist --manifest-path rust/crates/sqlty-ext/Cargo.toml
            -i ${{ matrix.container && '/opt/python/cp315-cp315/bin/python' || 'python3.15' }}
            ${{ github.event_name != 'pull_request' && (matrix.container && '/opt/python/cp314-cp314/bin/python /opt/python/cp314-cp314t/bin/python' || 'python3.14') || '' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}

      - name: Install uv
        if: ${{ env.SKIP != 'true' && !contains(matrix.target, 'musl') }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # A release builds from a clean cache: one a pull request wrote could poison it.
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Import the wheel on each Python
        if: ${{ env.SKIP != 'true' && !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          # 3.15 and 3.15t share the one abi3t wheel; the free-threaded build must keep the GIL off.
          for v in 3.14 3.15 3.15t; do
            case $v in 3.14) tag=cp314-cp314 ;; *) tag=cp315-abi3.abi3t ;; esac
            [ "$GITHUB_EVENT_NAME" = pull_request ] && [ $v = 3.14 ] && continue
            wheel=$(ls dist/sqlty-*-$tag-*.whl)
            # A bare 3.15 can resolve to the free-threaded build when it is first on PATH.
            req=$v; [[ $v == *t ]] || req=$v+gil
            uv venv -q --python "$req" "venv-$v"
            py="venv-$v/bin/python"; [ -x "$py" ] || py="venv-$v/Scripts/python.exe"
            uv pip install -q --python "$py" "$wheel"
            "$py" -c "import sys, sqlty, sqlty._core; assert sys._is_gil_enabled() != '$v'.endswith('t'); print(sqlty.__version__, sqlty.UNTYPED)"
          done

      # A musl wheel that links can still fail to dlopen (mimalloc with initial-exec TLS).
      - name: Import the musl wheel
        if: ${{ env.SKIP != 'true' && contains(matrix.target, 'musl') }}
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" "$IMAGE" sh -euc '
            for py in cp314-cp314 cp314-cp314t cp315-cp315 cp315-cp315t; do
              case $py in cp314-*) tag=$py ;; *) tag=cp315-abi3.abi3t ;; esac
              /opt/python/$py/bin/python -m venv /tmp/$py
              /tmp/$py/bin/pip install -q /dist/sqlty-*-$tag-*.whl
              /tmp/$py/bin/python -c "import sys, sqlty, sqlty._core; assert sys._is_gil_enabled() != \"$py\".endswith(\"t\"); print(sqlty.__version__, sqlty.UNTYPED)"
            done'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Check sqlty_magic.pth is in the wheel root and RECORD
        if: env.SKIP != 'true'
        shell: bash
        run: python tests/check_dist.py dist/*.whl

      - name: Upload wheels
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ strategy.job-index }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # A release builds from a clean cache: one a pull request wrote could poison it.
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Check sqlty_magic.pth is in the sdist
        shell: bash
        run: python3 tests/check_dist.py dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # The native sqlty executable (sqlty-cli), for npm and Homebrew.
  # Linux builds are static (musl), so one runs on every distribution.
  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pr: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
      fail-fast: false

    env:
      SKIP: ${{ github.event_name == 'pull_request' && !matrix.pr }}
      TARGET: ${{ matrix.target }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: env.SKIP != 'true'
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target "$TARGET"
          rustup default 1.99.1

      - name: Install musl-tools
        if: ${{ env.SKIP != 'true' && contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        if: env.SKIP != 'true'
        run: cargo build --locked --profile dist -p sqlty-cli --target "$TARGET" --manifest-path rust/Cargo.toml

      - name: Check the binary
        if: env.SKIP != 'true'
        run: |
          exe=sqlty; [[ $TARGET == *windows* ]] && exe=sqlty.exe
          mkdir -p "dist/bin/$TARGET"
          cp "rust/target/$TARGET/dist/$exe" "dist/bin/$TARGET/"
          version=$(sed -n '/^\[workspace.package\]/{n;s/^version = "\(.*\)"/\1/p;}' rust/Cargo.toml)
          test "$("dist/bin/$TARGET/$exe" version)" = "sqlty $version"

      - name: Upload binary
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # A run by hand packs and checks every package without publishing it.
  publish-to-npm:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    needs: build-binaries
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/sqlty
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Its npm 11.19.1 publishes through trusted publishing (OIDC), which needs 11.5.1.
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Publish the platform packages
        env:
          # Only for a package's first release: later ones publish through trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name != 'release' && '--dry-run' || '' }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/{n;s/^version = "\(.*\)"/\1/p;}' rust/Cargo.toml)
          for package in $(python3 scripts/package_binaries.py npm "$version" dist/bin dist/npm); do
            name=$(node -p "require('./$package/package.json').name")
            # npm refuses the unscoped name as too close to sqlite until it grants an exception.
            [ "$name" = sqlty ] && continue
            # A re-run skips what it published; a version someone else published stops it.
            built=$(cd "$package" && npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0))[0].integrity")
            published=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
            if [ -n "$published" ]; then
              [ "$published" = "$built" ] || { echo "::error::$name@$version on npm is not this build"; exit 1; }
              continue
            fi
            (cd "$package" && npm publish --access public ${DRY_RUN:---provenance})
          done

  # @sqlty/wasm: the engine as WebAssembly, for browsers, editors and Node.js.
  build-wasm:
    name: Build @sqlty/wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Build
        run: |
          make wasm
          cp LICENSE npm/wasm/

      - name: Check the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./npm/wasm/package.json').version")
          [ -z "$TAG" ] || [ "$TAG" = "v$version" ]
          node --test tests/wasm.test.mjs
          (cd npm/wasm && npm pack --dry-run)

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: npm/wasm/

  publish-wasm-to-npm:
    name: Publish @sqlty/wasm to npm
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sqlty/wasm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: wasm/

      # A re-run skips what it published; a version someone else published stops it.
      - name: Publish
        working-directory: wasm
        run: |
          version=$(node -p "require('./package.json').version")
          built=$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0))[0].integrity")
          published=$(npm view "@sqlty/wasm@$version" dist.integrity 2>/dev/null || true)
          if [ -n "$published" ]; then
            [ "$published" = "$built" ] || { echo "::error::@sqlty/wasm@$version on npm is not this build"; exit 1; }
            exit 0
          fi
          npm publish --access public --provenance

  # The formula downloads the platform packages from npm. A run by hand prints it without
  # pushing it.
  publish-to-homebrew:
    name: Update the Homebrew tap
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    needs: publish-to-npm
    runs-on: ubuntu-latest
    environment:
      name: homebrew
      url: https://github.com/jirikuncar/homebrew-sqlty

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      # The same tarballs the npm job published (it checks their integrity on the registry).
      - name: Write the formula
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/{n;s/^version = "\(.*\)"/\1/p;}' rust/Cargo.toml)
          [ -z "$TAG" ] || [ "$TAG" = "v$version" ]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/tarballs
          for package in $(python3 scripts/package_binaries.py npm "$version" dist/bin dist/npm); do
            (cd "$package" && npm pack --silent --pack-destination "$GITHUB_WORKSPACE/dist/tarballs")
          done
          python3 scripts/package_binaries.py homebrew "$version" dist/tarballs > sqlty.rb
          cat sqlty.rb

      - name: Push the formula to the tap
        if: github.event_name == 'release'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/jirikuncar/homebrew-sqlty.git" tap
          mkdir -p tap/Formula
          cp sqlty.rb tap/Formula/sqlty.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sqlty.rb
          git diff --cached --quiet || git commit -m "sqlty $VERSION"
          git push origin HEAD:main
