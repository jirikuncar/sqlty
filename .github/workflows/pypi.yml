name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pypi.yml
      - pyproject.toml
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# sqlty needs its compiled extension, so every supported platform gets a wheel;
# other platforms build from the sdist with a Rust toolchain.
jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds in the pypa images, which ship every CPython release.
          - os: ubuntu-latest
            target: x86_64
            pr: true
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-14
            target: aarch64
            pr: true
          - os: windows-latest
            target: x64
            pr: true
          - os: windows-11-arm
            target: aarch64
      fail-fast: false

    # A pull request builds one wheel per OS; a release, or a run by hand, builds all of
    # them, so the dry run before a release covers every platform.
    env:
      SKIP: ${{ github.event_name == 'pull_request' && !matrix.pr }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the supported Pythons
        if: env.SKIP != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.14
            3.15

      - name: Build wheels
        if: env.SKIP != 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --profile dist --out dist --find-interpreter --manifest-path rust/crates/sqlty-ext/Cargo.toml
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}

      - name: Install uv
        if: ${{ env.SKIP != 'true' && !contains(matrix.target, 'musl') }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        # A release builds from a clean cache: one a pull request wrote could poison it.
        with:
          enable-cache: false

      - name: Import the wheel on each Python
        if: ${{ env.SKIP != 'true' && !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          for v in 3.14 3.15; do
            t=cp${v/./}; wheel=$(ls dist/sqlty-*-$t-$t-*.whl)
            uv venv -q --python "$v" "venv-$v"
            py="venv-$v/bin/python"; [ -x "$py" ] || py="venv-$v/Scripts/python.exe"
            uv pip install -q --python "$py" "$wheel"
            "$py" -c "import sqlty, sqlty._core; print(sqlty.__version__, sqlty.UNTYPED)"
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Check sqlty_magic.pth is in the wheel root and RECORD
        if: env.SKIP != 'true'
        shell: bash
        run: python tests/check_dist.py dist/*.whl

      - name: Upload wheels
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ strategy.job-index }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        # A release builds from a clean cache: one a pull request wrote could poison it.
        with:
          enable-cache: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Check sqlty_magic.pth is in the sdist
        shell: bash
        run: python3 tests/check_dist.py dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
