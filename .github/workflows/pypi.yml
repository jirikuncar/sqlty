name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pypi.yml
      - pyproject.toml
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# sqlty needs its compiled extension, so every supported platform gets a wheel;
# other platforms build from the sdist with a Rust toolchain.
jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds in the pypa images, which ship every CPython release.
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
          - os: windows-11-arm
            target: aarch64
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.14
            3.15

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile dist --out dist --find-interpreter --manifest-path rust/crates/sqlty-ext/Cargo.toml
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}

      - name: Install uv
        if: ${{ !contains(matrix.target, 'musl') }}
        uses: astral-sh/setup-uv@v7

      - name: Import the wheel on each Python
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          for v in 3.14 3.15; do
            t=cp${v/./}; wheel=$(ls dist/sqlty-*-$t-$t-*.whl)
            uv venv -q --python "$v" "venv-$v"
            py="venv-$v/bin/python"; [ -x "$py" ] || py="venv-$v/Scripts/python.exe"
            uv pip install -q --python "$py" "$wheel"
            "$py" -c "import sqlty, sqlty._core; print(sqlty.__version__, sqlty.UNTYPED)"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check sqlty_magic.pth is in the wheel root and RECORD
        shell: bash
        run: python tests/check_dist.py dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ strategy.job-index }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Check sqlty_magic.pth is in the sdist
        shell: bash
        run: python3 tests/check_dist.py dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sqlty
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
