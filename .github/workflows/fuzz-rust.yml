name: Fuzz the engine

# Every playground request on generated input, with overflow checks and AddressSanitizer:
# a panic, an overflow or a stack overflow fails the run and uploads the input.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz
        default: "1200"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz sqlty-wasm run
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-01

    defaults:
      run:
        working-directory: rust/fuzz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly for -Zsanitizer; the coverage job pins the same one.
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Seed the corpus from the mdtests
        run: python3 seed.py ../../tests/mdtest corpus/run

      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '1200' }}
        run: >-
          cargo fuzz run -O -a run --
          -dict=sql.dict -timeout=30 -rss_limit_mb=4096
          -max_total_time="$SECONDS_TO_RUN" -fork=4

      - name: Minimize the corpus
        if: ${{ !cancelled() }}
        run: cargo fuzz cmin -O -a run

      - name: Save the corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: fuzz-artifacts
          path: rust/fuzz/artifacts/
