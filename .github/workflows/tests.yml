name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.14"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml

      - name: Run tests
        run: uv run pytest

      - name: Run mdtests (drift detection)
        run: uv run pytest tests/mdtest/ -v

      - name: Run conformance tests (validates Rust backend)
        run: uv run pytest tests/test_core_conformance.py -v

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

  test-pure-python:
    name: Test pure-Python fallback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust toolchain (needed by maturin build backend)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the project
        run: uv sync --all-groups

      - name: Remove Rust extension to test pure-Python fallback
        run: find "$(uv run python -c 'import sqlty; print(sqlty.__path__[0])')" -name '_core*.so' -delete

      - name: Run tests (pure-Python backend)
        run: uv run pytest tests/ --ignore=tests/e2e -q

  typecheck:
    name: Type check (mypy + ty)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install the project
        run: uv sync --all-groups

      - name: Run mypy on src
        run: uv run mypy src/sqlty

      - name: Run mypy on examples
        run: |
          for dir in examples/*/; do
            [ -f "$dir/queries.py" ] || continue
            echo "mypy -> $dir"
            uv run mypy "$dir"
          done

      - name: Run ty on src
        run: uv run ty check src/sqlty

      - name: Run ty on examples
        run: |
          for dir in examples/*/; do
            [ -f "$dir/queries.py" ] || continue
            echo "ty -> $dir"
            uv run ty check "$dir"
          done

      - name: Run type checker tests (mypy, pyright, ty)
        run: uv run pytest tests/test_typecheckers.py -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install the project
        run: uv sync --all-groups

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
