name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.15"
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml

      - name: Run tests
        run: uv run pytest

      - name: Run mdtests (drift detection)
        run: uv run pytest tests/mdtest/ -v

      - name: Run conformance tests (validates Rust backend)
        run: uv run pytest tests/test_core_conformance.py -v

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

  test-pure-python:
    name: Test pure-Python fallback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install Rust toolchain (needed by maturin build backend)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the project
        run: uv sync --all-groups

      - name: Remove Rust extension to test pure-Python fallback
        run: find "$(uv run python -c 'import sqlty; print(sqlty.__path__[0])')" -name '_core*.so' -delete

      - name: Run tests (pure-Python backend)
        run: uv run pytest tests/ --ignore=tests/e2e -q

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install the project
        run: uv sync --all-groups

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # pre-commit covers src/; type checker tests run with pytest in the test jobs
      - name: Type check examples (mypy + ty)
        run: make typecheck-examples

      - name: Run clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
