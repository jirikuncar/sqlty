name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job builds the extension once, with `maturin develop` on a cached target dir;
# `uv run` must not sync, which would build it again through the release profile.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.99.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust extension
        run: |
          uv sync --no-install-project
          uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund

      # VS Code finds the sqlty of the virtual environment on PATH.
      - name: Run the smoke test in VS Code
        working-directory: editors/vscode
        run: PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" xvfb-run -a npm test

      - name: Inspect V8 data
        if: always()
        working-directory: editors/vscode
        run: |
          set -x
          npx c8 report --reporter text --check-coverage=false 2>&1 | head -20
          npx c8 report --reporter text --check-coverage=false --all=false 2>&1 | head -20
          npx c8 report --reporter text --check-coverage=false --all=false --exclude-after-remap=false --include 'dist/**' 2>&1 | head -20
          npx c8 report --reporter text --check-coverage=false --all=false --include 'dist/extension.js' --exclude-after-remap=false 2>&1 | grep -v node_modules | head -30

      - name: Run the web test in VS Code for the Web
        if: false
        working-directory: editors/vscode
        run: |
          npx playwright install --with-deps chromium
          npm run test-web

