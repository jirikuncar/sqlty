name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job builds the extension once, with `maturin develop` on a cached target dir;
# `uv run` must not sync, which would build it again through the release profile.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which packages the change affects, with the packages that depend on them
  # (scripts/ci_changes.py). A push to main runs every package, so its caches stay whole.
  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
      python: ${{ steps.changes.outputs.python }}
      engine: ${{ steps.changes.outputs.engine }}
      vscode: ${{ steps.changes.outputs.vscode }}
      playground: ${{ steps.changes.outputs.playground }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/ci_changes.py $BASE

  # The one required check: it passes when every job the change needs passed.
  ci:
    name: CI
    if: always()
    needs: [changes, no-exec-harness, rust, test, free-threaded, wasm, pg-fidelity, mysql-fidelity, bench, codspeed, package, vscode, lint]
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

  no-exec-harness:
    name: No-exec harness intact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The base branch's copy of the check, so a pull request cannot relax it.
      - name: Compare with the base branch
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:scripts/check_no_exec_harness.py" > "$RUNNER_TEMP/harness.py" \
            || cp scripts/check_no_exec_harness.py "$RUNNER_TEMP/harness.py"
          python3 "$RUNNER_TEMP/harness.py" "$BASE"

  # Each crate's own tests, gated on the lines they never run (scripts/coverage.sh).
  rust:
    name: Rust ${{ matrix.crate.dir }}
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
      fail-fast: false
    env:
      # Coverage builds on nightly for `#[coverage(off)]`.
      RUSTUP_TOOLCHAIN: nightly-2026-11-01
      CRATE: ${{ matrix.crate.dir }}
      PACKAGE: ${{ matrix.crate.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: ${{ matrix.crate.dir }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.148

      - name: Run the tests and check coverage
        run: scripts/coverage.sh "$CRATE"

      - name: Run the doctests
        run: cargo test --doc -p "$PACKAGE" --manifest-path rust/Cargo.toml

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
        include:
          - python-version: "3.15"
            coverage: true
      fail-fast: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          rust-cache-key: python-${{ matrix.python-version }}
          # Coverage builds on nightly for `#[coverage(off)]`.
          toolchain: ${{ matrix.coverage && 'nightly-2026-11-01' || '' }}
          components: ${{ matrix.coverage && 'llvm-tools-preview' || '' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ matrix.coverage && 'cargo-llvm-cov@0.9.1,' || '' }}nextest@0.9.148

      # The `pg` tests too, each worker on its own database (tests/conftest.py), then the
      # extension crate's Rust tests.
      - name: Run the tests and check coverage
        if: matrix.coverage
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-01
        run: scripts/coverage.sh python

      - name: Build Rust extension
        if: ${{ !matrix.coverage }}
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest

      - name: Run timing tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m timing -n 0 -p no:randomly

      - name: Run the extension's Rust tests
        if: ${{ !matrix.coverage }}
        run: uv run cargo nextest run -p sqlty-core --manifest-path rust/Cargo.toml

  free-threaded:
    name: Threads on free-threaded Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14t builds a cp314t extension, 3.15t the abi3t one.
        python: ["3.14t", "3.15t"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}-${{ matrix.python }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the extension and run the thread tests
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv export --only-group dev --no-hashes --no-emit-project --quiet > "$RUNNER_TEMP/locked.txt"
          uv pip install maturin pytest pytest-cov pytest-xdist --constraint "$RUNNER_TEMP/locked.txt"
          uv run --no-sync maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml
          uv run --no-sync python -c "import sys; from sqlty import _core; assert not sys._is_gil_enabled()"
          uv run --no-sync pytest -p no:randomly tests/test_threads.py

  # The bundled VS Code engine of #855 and the docs playground run on WebAssembly: keep the
  # engine crates building for it. sqlty-lsp needs file paths, which wasm32-unknown-unknown
  # has no notion of.
  wasm:
    name: Engine builds for WebAssembly
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build for wasm32-unknown-unknown
        run: cargo build --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -p sqlty-sql -p sqlty-python

      - name: Build for wasm32-wasip1
        run: cargo build --manifest-path rust/Cargo.toml --target wasm32-wasip1 -p sqlty-sql -p sqlty-python -p sqlty-lsp

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Run the docs playground's engine
        run: |
          make playground
          node --test --experimental-test-coverage --test-coverage-include='docs/assets/playground/*.js' \
            --test-coverage-lines=100 --test-coverage-functions=100 --test-coverage-branches=92 \
            tests/playground.test.mjs tests/ask.test.mjs

  pg-fidelity:
    name: PostgreSQL column names, types and nullability
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable database: the test drops every schema between mdtest sections.
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare with the server's column names and types
        run: uv run pytest tests/test_pg_describe.py tests/test_pg_common_types.py tests/test_driver_values.py -rs -q

  mysql-fidelity:
    name: MySQL column names and types
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A disposable server: the test drops and creates the database sqlty_describe.
      SQLTY_MYSQL_DSN: mysql://root@127.0.0.1:3306/probe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare with the server's column names and types
        run: uv run --with pymysql pytest tests/test_server_describe.py tests/test_driver_values.py -rs -q

  bench:
    name: Performance budget
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build the release extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Fails when a time (normalised by a calibration loop) or peak RSS is over
      # the budget in benchmarks/baseline.json. See benchmarks/README.md.
      - name: Run benchmarks against the baseline
        run: make bench-ci

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: ignore

  codspeed:
    name: CodSpeed
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodSpeed authenticates over OpenID Connect rather than an upload token.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --group dev --group bench --no-install-project

      - name: Build the release extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # The upload needs the repository enabled on codspeed.io; until the CODSPEED
      # variable says so, each benchmark runs once, unmeasured.
      - name: Run the benchmarks once
        if: vars.CODSPEED != 'true'
        run: uv run pytest benchmarks/ -n 0 -p no:randomly --no-cov

      # Simulation counts instructions, so a run is stable on a shared runner: the engine
      # is CPU-bound, with no I/O for instruction counting to miss.
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        if: vars.CODSPEED == 'true'
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed -n 0 -p no:randomly --no-cov

  package:
    name: Package (wheel + sdist, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        # The default too: the wheel builds outside this checkout, in the unpacked sdist.
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: python-${{ matrix.python-version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Build at the lowest supported maturin: before 1.12.1 `include` resolved against
      # python-source and dropped sqlty_magic.pth from the wheel; before 1.15 abi3t broke.
      - name: Build sdist, then wheel from sdist (maturin floor)
        # The wheel builds in a temporary unpacked sdist; the cached target dir stays shared.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          echo 'maturin==1.15.0' > "$RUNNER_TEMP/maturin-floor.txt"
          uv build --out-dir dist --build-constraint "$RUNNER_TEMP/maturin-floor.txt"

      - name: Check sqlty_magic.pth is in the wheel root, RECORD and sdist
        run: python3 tests/check_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel and import a coding-sqlty module
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          printf '# coding: sqlty\nq = "--sql\\nSELECT 1::INTEGER AS x"\nassert type(q).__name__ == "SQL", q\n' > coded.py
          "$RUNNER_TEMP/venv/bin/python" -B -c 'import sys; assert "sqlty" not in sys.modules; import coded'
          ! SQLTY_NO_MAGIC=1 "$RUNNER_TEMP/venv/bin/python" -B -c 'import coded'

      - name: The wheel built from the sdist prints the Agent Skills
        run: |
          "$RUNNER_TEMP/venv/bin/sqlty" skill --list
          "$RUNNER_TEMP/venv/bin/sqlty" skill | head -2 | grep -qx 'name: sqlty'

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust extension
        run: |
          uv sync --no-install-project
          uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund

      # VS Code finds the sqlty of the virtual environment on PATH.
      - name: Run the smoke test in VS Code
        working-directory: editors/vscode
        run: PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" xvfb-run -a npm test

      - name: Run the web test in VS Code for the Web
        working-directory: editors/vscode
        run: |
          npx playwright install --with-deps chromium
          npm run test-web

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      # The hooks check examples with sqlty, so they need the extension.
      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # The hook of editors/vscode runs tsc, oxlint and oxfmt.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      # Type checker tests of SQL[T] run with pytest in the test jobs
      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Validate the plugin manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict --profile directory .

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
