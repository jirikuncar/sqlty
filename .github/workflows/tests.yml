name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job builds the extension once, with `maturin develop` on a cached target dir;
# `uv run` must not sync, which would build it again through the release profile.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which packages the change affects, with the packages that depend on them
  # (scripts/ci_changes.py). A push to main runs every package, so its caches stay whole.
  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
      packages: ${{ steps.changes.outputs.packages }}
      python: ${{ steps.changes.outputs.python }}
      docs: ${{ steps.changes.outputs.docs }}
      free-threaded: ${{ steps.changes.outputs.free-threaded }}
      pg-fidelity: ${{ steps.changes.outputs.pg-fidelity }}
      mysql-fidelity: ${{ steps.changes.outputs.mysql-fidelity }}
      bench: ${{ steps.changes.outputs.bench }}
      package: ${{ steps.changes.outputs.package }}
      vscode: ${{ steps.changes.outputs.vscode }}
      playground: ${{ steps.changes.outputs.playground }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/ci_changes.py $BASE

  # The one required check: it passes when every job the change needs passed.
  ci:
    name: CI
    if: always()
    needs: [changes, no-exec-harness, rust, test, docs, free-threaded, wasm, fidelity, bench, package, vscode, lint]
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

  no-exec-harness:
    name: No-exec harness intact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The base branch's copy of the check, so a pull request cannot relax it.
      - name: Compare with the base branch
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:scripts/check_no_exec_harness.py" > "$RUNNER_TEMP/harness.py" \
            || cp scripts/check_no_exec_harness.py "$RUNNER_TEMP/harness.py"
          python3 "$RUNNER_TEMP/harness.py" "$BASE"

  # Each affected crate's own tests, gated on the lines they never run (scripts/coverage.sh),
  # one after another on one target dir; the doctests build on their own in the background.
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.crates != ''
    runs-on: ubuntu-latest
    env:
      # Coverage builds on nightly for `#[coverage(off)]`.
      RUSTUP_TOOLCHAIN: nightly-2026-11-01
      CRATES: ${{ needs.changes.outputs.crates }}
      PACKAGES: ${{ needs.changes.outputs.packages }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          env -u RUSTUP_TOOLCHAIN rustup toolchain install --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.148

      # On the toolchain of rust-toolchain.toml, in a target dir coverage never cleans
      # (outside rust/target, which rust-cache keeps).
      - name: Run the doctests
        id: doctests
        background: true
        run: |
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          env -u RUSTUP_TOOLCHAIN cargo test --doc "${args[@]}" --manifest-path rust/Cargo.toml \
            --target-dir doc-tests

      - name: Run the tests and check coverage
        run: scripts/coverage.sh $CRATES

      - wait: doctests

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
        include:
          - python-version: "3.15"
            coverage: true
      fail-fast: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          rust-cache-key: python-${{ matrix.python-version }}
          # Coverage builds on nightly for `#[coverage(off)]`.
          toolchain: ${{ matrix.coverage && 'nightly-2026-11-01' || '' }}
          components: ${{ matrix.coverage && 'llvm-tools-preview' || '' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: ${{ matrix.coverage && 'cargo-llvm-cov@0.9.1,' || '' }}nextest@0.9.148

      # The `pg` tests too, each worker on its own database (tests/conftest.py), then the
      # extension crate's Rust tests.
      - name: Run the tests and check coverage
        if: matrix.coverage
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-01
        run: scripts/coverage.sh python

      - name: Build Rust extension
        if: ${{ !matrix.coverage }}
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest

      - name: Run timing tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m timing -n 0 -p no:randomly

      - name: Run the extension's Rust tests
        if: ${{ !matrix.coverage }}
        run: uv run cargo nextest run -p sqlty-core --manifest-path rust/Cargo.toml

  # The guides alone: the tests that read them and their mdtests, without the Python matrix.
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.python != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: "3.14"
          rust-cache-key: python-3.14

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run the tests that read the docs
        run: uv run pytest tests/test_docs.py tests/test_core_invariants.py tests/test_duplicates.py tests/test_rust_types.py docs README.md

  free-threaded:
    name: Threads on free-threaded Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.free-threaded == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14t builds a cp314t extension, 3.15t the abi3t one.
        python: ["3.14t", "3.15t"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-suffix: ${{ github.job }}-${{ matrix.python }}

      - name: Build the extension and run the thread tests
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv export --only-group dev --no-hashes --no-emit-project --quiet > "$RUNNER_TEMP/locked.txt"
          uv pip install maturin pytest pytest-cov pytest-xdist --constraint "$RUNNER_TEMP/locked.txt"
          uv run --no-sync maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml
          uv run --no-sync python -c "import sys; from sqlty import _core; assert not sys._is_gil_enabled()"
          uv run --no-sync pytest -p no:randomly tests/test_threads.py

  # The bundled VS Code engine of #855 and the docs playground run on WebAssembly: keep the
  # engine crates building for it. sqlty-lsp needs file paths, which wasm32-unknown-unknown
  # has no notion of.
  wasm:
    name: Engine builds for WebAssembly
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          targets: wasm32-unknown-unknown wasm32-wasip1

      - name: Build for wasm32-unknown-unknown
        run: cargo build --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -p sqlty-sql -p sqlty-python

      - name: Build for wasm32-wasip1
        run: cargo build --manifest-path rust/Cargo.toml --target wasm32-wasip1 -p sqlty-sql -p sqlty-python -p sqlty-lsp

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Run the engine of the docs playground and @sqlty/wasm
        run: |
          make playground
          node --test --experimental-test-coverage \
            --test-coverage-include='docs/assets/playground/*.js' --test-coverage-include='npm/wasm/*.js' \
            --test-coverage-lines=100 --test-coverage-functions=100 --test-coverage-branches=92 \
            tests/playground.test.mjs tests/ask.test.mjs tests/wasm.test.mjs tests/release.test.mjs

  # The queries of the mdtests on PostgreSQL and MySQL, each compared with sqlty's columns.
  fidelity:
    name: Database column names, types and nullability
    needs: changes
    if: needs.changes.outputs.pg-fidelity == 'true' || needs.changes.outputs.mysql-fidelity == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: "3.14"

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Each waits on its server, so the two run at once; each with half the workers.
      - parallel:
          - name: Compare with PostgreSQL's column names and types
            if: needs.changes.outputs.pg-fidelity == 'true'
            env:
              # A disposable database: the test drops every schema between mdtest sections.
              SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
            run: uv run pytest tests/test_pg_describe.py tests/test_pg_common_types.py tests/test_driver_values.py -rs -q -n 2

          - name: Compare with MySQL's column names and types
            if: needs.changes.outputs.mysql-fidelity == 'true'
            env:
              # A disposable server: the test drops and creates the database sqlty_describe.
              SQLTY_MYSQL_DSN: mysql://root@127.0.0.1:3306/probe
            run: uv run --with pymysql pytest tests/test_server_describe.py tests/test_driver_values.py -rs -q -n 2

  # One release build for both; never in parallel, as bench-ci measures wall time.
  bench:
    name: Performance budget and CodSpeed
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodSpeed authenticates over OpenID Connect rather than an upload token.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: "3.15"

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build the release extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Fails when a time (normalised by a calibration loop) or peak RSS is over
      # the budget in benchmarks/baseline.json. See benchmarks/README.md.
      - name: Run benchmarks against the baseline
        run: make bench-ci

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: ignore

      # The upload needs the repository enabled on codspeed.io; until the CODSPEED
      # variable says so, each benchmark runs once, unmeasured.
      - name: Run the benchmarks once
        if: vars.CODSPEED != 'true'
        run: uv run pytest benchmarks/ -n 0 -p no:randomly --no-cov

      # Simulation counts instructions, so a run is stable on a shared runner: the engine
      # is CPU-bound, with no I/O for instruction counting to miss.
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        if: vars.CODSPEED == 'true'
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed -n 0 -p no:randomly --no-cov

  package:
    name: Package (wheel + sdist, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          rust-cache-key: python-${{ matrix.python-version }}

      # Build at the lowest supported maturin: before 1.12.1 `include` resolved against
      # python-source and dropped sqlty_magic.pth from the wheel; before 1.15 abi3t broke.
      - name: Build sdist, then wheel from sdist (maturin floor)
        # The wheel builds in a temporary unpacked sdist; the cached target dir stays shared.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          echo 'maturin==1.15.0' > "$RUNNER_TEMP/maturin-floor.txt"
          uv build --out-dir dist --build-constraint "$RUNNER_TEMP/maturin-floor.txt"

      - name: Check sqlty_magic.pth is in the wheel root, RECORD and sdist
        run: python3 tests/check_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel and import a coding-sqlty module
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          printf '# coding: sqlty\nq = "--sql\\nSELECT 1::INTEGER AS x"\nassert type(q).__name__ == "SQL", q\n' > coded.py
          "$RUNNER_TEMP/venv/bin/python" -B -c 'import sys; assert "sqlty" not in sys.modules; import coded'
          ! SQLTY_NO_MAGIC=1 "$RUNNER_TEMP/venv/bin/python" -B -c 'import coded'

      - name: The wheel built from the sdist prints the Agent Skills
        run: |
          "$RUNNER_TEMP/venv/bin/sqlty" skill --list
          "$RUNNER_TEMP/venv/bin/sqlty" skill | head -2 | grep -qx 'name: sqlty'

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: "3.15"
          targets: wasm32-unknown-unknown

      - name: Build Rust extension
        run: |
          uv sync --no-install-project
          uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund

      # VS Code finds the sqlty of the virtual environment on PATH.
      - name: Run the smoke test in VS Code
        working-directory: editors/vscode
        run: PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" xvfb-run -a npm test

      - name: Run the web test in VS Code for the Web
        working-directory: editors/vscode
        run: |
          npx playwright install --with-deps chromium
          npm run test-web

  # A pull request runs each hook on the files it changes, and builds only what those hooks
  # need; a push to main runs every hook on every file.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # The `files` patterns of the hooks in prek.toml that need the extension or Node.
      - name: Find what the changed files need
        id: needs
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only --no-renames "$BASE...HEAD")
            echo "range=--from-ref $BASE --to-ref HEAD" >> "$GITHUB_OUTPUT"
          else
            changed=$(git ls-files)
            echo "range=--all-files" >> "$GITHUB_OUTPUT"
          fi
          has() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          {
            echo "extension=$(has '^(examples|src/sqlty|rust/crates)/')"
            echo "node=$(has '^editors/vscode/')"
            echo "plugins=$(has '^(\.claude-plugin|\.codex-plugin|\.cursor-plugin|skills)/')"
            echo "vale=$(has '^\.vale(\.ini$|/)')"
          } >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup
        with:
          python-version: "3.15"

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      # The hooks check examples with sqlty, so they need the extension.
      - name: Build Rust extension
        if: steps.needs.outputs.extension == 'true'
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # The hook of editors/vscode runs tsc, oxlint and oxfmt; the plugin check runs on Node.
      - name: Install Node
        if: steps.needs.outputs.node == 'true' || steps.needs.outputs.plugins == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      # Type checker tests of SQL[T] run with pytest in the test jobs
      - name: Run prek
        env:
          RANGE: ${{ steps.needs.outputs.range }}
        run: uv run prek run $RANGE --show-diff-on-failure

      # The styles judge every page, not only the changed ones.
      - name: Run Vale on every page
        if: steps.needs.outputs.vale == 'true' && github.event_name == 'pull_request'
        run: uv run prek run vale --all-files

      - name: Validate the plugin manifests
        if: steps.needs.outputs.plugins == 'true'
        run: npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict --profile directory .

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
