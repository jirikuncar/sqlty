name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.14"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml

      - name: Run tests
        run: uv run pytest

      - name: Run mdtests (drift detection)
        run: uv run pytest tests/mdtest/ -v

      - name: Run conformance tests (validates Rust backend)
        run: uv run pytest tests/test_core_conformance.py -v

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

  test-pure-python:
    name: Test pure-Python fallback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install without Rust
        run: uv sync --all-groups --no-build-isolation
        env:
          # Skip maturin build — test pure-Python fallback
          MATURIN_PEP517_ARGS: "--skip-auditwheel"

      - name: Run tests (pure-Python backend)
        run: uv run pytest tests/ --ignore=tests/e2e -q

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Build Rust extension (needed for sqlty hooks)
        run: |
          rustup default stable
          uv run maturin develop --manifest-path rust/Cargo.toml
        continue-on-error: true

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
