name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run tests
        run: uv run pytest

      - name: Run Rust unit tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  pg-fidelity:
    name: PostgreSQL column names and types
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable database: the test drops every schema between mdtest sections.
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare with the server's column names and types
        run: uv run pytest tests/test_pg_describe.py -rs -q

  bench:
    name: Performance budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-bench-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-bench-${{ runner.os }}-

      - name: Install the project
        run: uv sync --all-groups

      - name: Build the release extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Fails when a time (normalised by a calibration loop) or peak RSS is over
      # the budget in benchmarks/baseline.json. See benchmarks/README.md.
      - name: Run benchmarks against the baseline
        run: make bench-ci

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: ignore

  package:
    name: Package (wheel + sdist, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build at the lowest supported maturin: older versions resolve
      # `include` against python-source and drop sqlty_magic.pth from the wheel.
      - name: Build sdist, then wheel from sdist (maturin floor)
        run: |
          echo 'maturin==1.12.1' > "$RUNNER_TEMP/maturin-floor.txt"
          uv build --out-dir dist --build-constraint "$RUNNER_TEMP/maturin-floor.txt"

      - name: Check sqlty_magic.pth is in the wheel root, RECORD and sdist
        run: python3 tests/check_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel and import a coding-sqlty module
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          printf '# coding: sqlty\nq = "--sql\\nSELECT 1::INTEGER AS x"\nassert type(q).__name__ == "SQL", q\n' > coded.py
          "$RUNNER_TEMP/venv/bin/python" -B -c 'import sys; assert "sqlty" not in sys.modules; import coded'
          ! SQLTY_NO_MAGIC=1 "$RUNNER_TEMP/venv/bin/python" -B -c 'import coded'

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install the project
        run: uv sync --all-groups

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # pre-commit covers src/; type checker tests run with pytest in the test jobs
      - name: Type check examples (mypy + ty)
        run: make typecheck-examples

      - name: Run clippy
        run: cargo clippy --workspace --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
