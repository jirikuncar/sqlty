name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job builds the extension once, with `maturin develop` on a cached target dir;
# `uv run` must not sync, which would build it again through the release profile.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          key: python-${{ matrix.python-version }}
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run tests
        run: uv run pytest

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.148

      - name: Run Rust unit tests
        run: cargo nextest run --workspace --manifest-path rust/Cargo.toml

      - name: Run Rust doctests
        run: cargo test --doc --workspace --manifest-path rust/Cargo.toml

  free-threaded:
    name: Threads on free-threaded Python 3.14t
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the extension and run the thread tests
        run: |
          uv venv --python 3.14t
          uv export --only-group dev --no-hashes --no-emit-project --quiet > "$RUNNER_TEMP/locked.txt"
          uv pip install maturin pytest --constraint "$RUNNER_TEMP/locked.txt"
          uv run --no-sync maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml
          uv run --no-sync python -c "import sys; from sqlty import _core; assert not sys._is_gil_enabled()"
          uv run --no-sync pytest -p no:randomly tests/test_threads.py

  pg-fidelity:
    name: PostgreSQL column names and types
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable database: the test drops every schema between mdtest sections.
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare with the server's column names and types
        run: uv run pytest tests/test_pg_describe.py tests/test_pg_common_types.py tests/test_driver_values.py -rs -q

  mysql-fidelity:
    name: MySQL column names and types
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A disposable server: the test drops and creates the database sqlty_describe.
      SQLTY_MYSQL_DSN: mysql://root@127.0.0.1:3306/probe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare with the server's column names and types
        run: uv run --with pymysql pytest tests/test_server_describe.py tests/test_driver_values.py -rs -q

  lean-model:
    name: Lean model of the type mapping
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the proofs and build the model
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: proofs
          build: true
          test: false
          lint: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Compare the model with sqlty
        run: uv run pytest tests/test_lean_model.py -q -p no:randomly

  bench:
    name: Performance budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build the release extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Fails when a time (normalised by a calibration loop) or peak RSS is over
      # the budget in benchmarks/baseline.json. See benchmarks/README.md.
      - name: Run benchmarks against the baseline
        run: make bench-ci

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: ignore

  package:
    name: Package (wheel + sdist, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Build at the lowest supported maturin: older versions resolve
      # `include` against python-source and drop sqlty_magic.pth from the wheel.
      - name: Build sdist, then wheel from sdist (maturin floor)
        run: |
          echo 'maturin==1.12.1' > "$RUNNER_TEMP/maturin-floor.txt"
          uv build --out-dir dist --build-constraint "$RUNNER_TEMP/maturin-floor.txt"

      - name: Check sqlty_magic.pth is in the wheel root, RECORD and sdist
        run: python3 tests/check_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel and import a coding-sqlty module
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          printf '# coding: sqlty\nq = "--sql\\nSELECT 1::INTEGER AS x"\nassert type(q).__name__ == "SQL", q\n' > coded.py
          "$RUNNER_TEMP/venv/bin/python" -B -c 'import sys; assert "sqlty" not in sys.modules; import coded'
          ! SQLTY_NO_MAGIC=1 "$RUNNER_TEMP/venv/bin/python" -B -c 'import coded'

      - name: The wheel built from the sdist prints the Agent Skills
        run: |
          "$RUNNER_TEMP/venv/bin/sqlty" skill --list
          "$RUNNER_TEMP/venv/bin/sqlty" skill | head -2 | grep -qx 'name: sqlty'

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.15"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      # The hooks check examples with sqlty, so they need the extension.
      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/sqlty-ext/Cargo.toml

      # Type checker tests of SQL[T] run with pytest in the test jobs
      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Validate the plugin manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate .

      # Show diff ONLY if previous step failed
      - name: Show git diff
        if: failure()
        run: git --no-pager diff || true
