name: Compatibility

# Reruns the comparisons in scripts/compat/ with the versions pinned in
# scripts/compat/pyproject.toml: on the Dependabot pull request that bumps one, weekly
# for engine changes, and on demand. The job summary shows how the reports changed.
on:
  pull_request:
    paths:
      - "scripts/compat/**"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare with drivers and ORMs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      SQLTY_MYSQL_DSN: mysql://root@127.0.0.1:3306/probe

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install the MySQL client library for mysqlclient
        run: sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install the project (with Rust extension)
        run: uv sync --all-groups

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run the comparisons
        run: scripts/compat/run.sh

      - name: Summarize report changes
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Report changes"
            echo
            if git diff --quiet -- scripts/compat/reports; then
              echo "None: the reports match the committed ones."
            else
              echo '```diff'
              git diff -- 'scripts/compat/reports/*.md'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: compat-reports
          path: scripts/compat/reports/
