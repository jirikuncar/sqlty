name: Compatibility

# Reruns the comparisons in scripts/compat/ with the versions pinned in
# scripts/compat/pyproject.toml: on the Dependabot pull request that bumps one, weekly
# for engine changes, and on demand. The job summary shows how the reports changed.
on:
  pull_request:
    paths:
      - "scripts/compat/**"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# `uv run` must not sync: that would build the extension again, through the release profile.
env:
  UV_NO_SYNC: "1"

jobs:
  compare:
    name: Compare with drivers and ORMs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SQLTY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      SQLTY_MYSQL_DSN: mysql://root@127.0.0.1:3306/probe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # Built wheels (duckdb has none for 3.15) are kept with the lock; main writes them.
          cache-dependency-glob: uv.lock
          # Jobs install different groups: each keeps its own cache.
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the MySQL client library for mysqlclient
        run: sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install the dependencies
        run: uv sync --all-groups --no-group duckdb --no-install-project

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path rust/crates/sqlty-ext/Cargo.toml

      - name: Run the comparisons
        run: scripts/compat/run.sh

      - name: Compare nullability with rows on PostgreSQL
        if: ${{ !cancelled() }}
        run: uv run python scripts/compat/pg_nullability.py

      - name: Summarize report changes
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Report changes"
            echo
            if git diff --quiet -- scripts/compat/reports; then
              echo "None: the reports match the committed ones."
            else
              echo '```diff'
              git diff -- 'scripts/compat/reports/*.md'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: compat-reports
          path: scripts/compat/reports/
