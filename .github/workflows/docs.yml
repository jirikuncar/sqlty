name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "scripts/generate_playground_examples.py"
      - "scripts/vendor_assets.py"
      - "scripts/offline.py"
      - "scripts/playground_links.py"
      - "tests/_mdtest/parser.py"
      - "scripts/check_playground.py"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "rust/**"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "scripts/generate_playground_examples.py"
      - "scripts/vendor_assets.py"
      - "scripts/offline.py"
      - "scripts/playground_links.py"
      - "tests/_mdtest/parser.py"
      - "scripts/check_playground.py"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build docs (strict)
        run: make docs

      - name: Report the size of the playground engine
        run: |
          wasm=docs/assets/playground/sqlty_wasm.wasm
          echo "Playground engine: $(stat -c %s "$wasm") bytes, $(gzip -9c "$wasm" | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the playground under /sqlty/
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py --site site

      - name: Upload the preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the deployed playground
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py "${PAGE_URL}playground/"

  changes:
    name: Docs changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.files.outputs.docs }}
    steps:
      - name: Look for changes to the docs or how they are previewed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[].filename' \
            | grep -qE '^(docs/|overrides/|zensical\.toml$|wrangler\.jsonc$|\.github/workflows/docs(-preview-cleanup)?\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    name: Preview
    needs: [build, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: docs-preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      # A pull request can change this job too, so the docs-preview approval is what guards the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            wrangler.jsonc
            scripts/check_playground.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: public

      - name: Keep only regular files, and no Workers control files
        run: |
          # Workers runs `_worker.js` and reads `_headers` and `_redirects` from the assets.
          if find public \( ! -type f ! -type d \) -o -name '_worker.js' -o -name '_headers' -o -name '_redirects' | grep -q .; then
            echo "The build may hold only regular files, and no Workers control files" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy the Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler.ndjson"
          npx --yes wrangler@4.158.0 preview --name "pr-$NUMBER" --message "${HEAD_SHA::7}"
          url=$(jq -er 'select(.type == "preview") | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the previewed playground
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py "${URL%/}/playground/"

      - name: Link the Preview from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$NUMBER" --edit-last --create-if-none --body "Docs preview for ${HEAD_SHA::7}: ${URL%/}/ ([playground](${URL%/}/playground/))"
