name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "scripts/generate_playground_examples.py"
      - "scripts/vendor_assets.py"
      - "scripts/offline.py"
      - "scripts/check_playground.py"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "rust/**"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "scripts/generate_playground_examples.py"
      - "scripts/vendor_assets.py"
      - "scripts/offline.py"
      - "scripts/check_playground.py"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build docs (strict)
        run: make docs

      - name: Report the size of the playground engine
        run: |
          wasm=docs/assets/playground/sqlty_wasm.wasm
          echo "Playground engine: $(stat -c %s "$wasm") bytes, $(gzip -9c "$wasm" | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the playground under /sqlty/
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py --site site

      - name: Record the pull request for its preview
        if: github.event_name == 'pull_request'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: jq -n --argjson number "$NUMBER" --arg head_sha "$HEAD_SHA" '{$number, $head_sha}' > site/.pull-request.json

      - name: Upload the preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: site
          include-hidden-files: true
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the deployed playground
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py "${PAGE_URL}playground/"
