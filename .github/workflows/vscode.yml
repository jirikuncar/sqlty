name: VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vscode.yml
      - editors/vscode/**

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The extension's version is the release's: it runs the project's own sqlty, so it
# publishes with every release or manual run, as a dry run on a pull request that changes it.
jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Take the release's version
        if: github.event_name == 'release'
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm run package -- --out sqlty.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: editors/vscode/sqlty.vsix

  publish:
    name: Publish to the Marketplace and Open VSX
    needs: package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: vscode
      url: https://marketplace.visualstudio.com/items?itemName=jirikuncar.sqlty
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: editors/vscode
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath sqlty.vsix
      - name: Publish to Open VSX
        run: npx ovsx publish sqlty.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
