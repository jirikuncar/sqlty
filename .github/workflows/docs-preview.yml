# Deploys the docs a pull request built (docs.yml) as a Cloudflare Worker Preview,
# pr-<number>-sqlty.jirikuncar.workers.dev, once a maintainer approves the
# docs-preview environment. Runs from main with the token; the pull request's code
# never runs here, only its built files are uploaded.
name: Docs preview

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- runs main's code on built files only
    workflows: [Docs]
    types: [completed]

permissions: {}

env:
  WRANGLER: wrangler@4.158.0

jobs:
  check:
    name: Check
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      docs: ${{ steps.pr.outputs.docs }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Match the artifact to an open pull request that changes the docs
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(jq -er '.number | numbers' site/.pull-request.json)
          pr=$(gh api "repos/$REPO/pulls/$number")
          test "$(jq -r .head.sha <<<"$pr")" = "$HEAD_SHA"
          test "$(jq -r .state <<<"$pr")" = open
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if gh api --paginate "repos/$REPO/pulls/$number/files" --jq '.[].filename' \
            | grep -qE '^(docs/|overrides/|zensical\.toml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: check
    if: needs.check.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    environment:
      name: docs-preview
      url: ${{ steps.preview.outputs.url }}
    concurrency:
      group: docs-preview-${{ needs.check.outputs.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            wrangler.jsonc
            scripts/check_playground.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: public/sqlty
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Lay out the site under /sqlty/, as on GitHub Pages
        run: |
          rm public/sqlty/.pull-request.json
          # Workers runs `_worker.js` and reads `_headers` and `_redirects` from the
          # assets: none may come from the pull request.
          if find public/sqlty \( ! -type f ! -type d \) -o -name '_worker.js' -o -name '_headers' -o -name '_redirects' | grep -q .; then
            echo "The build may hold only regular files, and no Workers control files" >&2
            exit 1
          fi
          printf '/ /sqlty/ 302\n' > public/_redirects

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy the Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NUMBER: ${{ needs.check.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          out=$(npx --yes "$WRANGLER" preview --name "pr-$NUMBER" --message "${HEAD_SHA::7}" --json)
          echo "url=$(jq -er '.preview.urls[0]' <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the previewed playground
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          uvx --python 3.13 --from playwright==1.64.1 playwright install --with-deps chromium-headless-shell
          uvx --python 3.13 --with playwright==1.64.1 python scripts/check_playground.py "${URL%/}/sqlty/playground/"

      - name: Link the Preview from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.check.outputs.number }}
          URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment "$NUMBER" --edit-last --create-if-none --body "Docs preview for ${HEAD_SHA::7}: ${URL%/}/sqlty/ ([playground](${URL%/}/sqlty/playground/))"
