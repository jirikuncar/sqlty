{% extends "base.html" %}
{% block extrahead %}
  <link rel="icon" href="{{ 'assets/favicon/favicon.ico' | url }}" sizes="32x32">
  <script>
    (() => {
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const href = { false: "{{ 'assets/sqlty-mark-light.svg' | url }}", true: "{{ 'assets/sqlty-mark-dark.svg' | url }}" };
      const swap = () => {
        const old = document.querySelector('link[rel="icon"][href$=".svg"]');
        const icon = old.cloneNode();
        icon.href = href[dark.matches];
        old.replaceWith(icon);
      };
      swap();
      dark.addEventListener("change", swap);
    })();
  </script>
  <link rel="apple-touch-icon" href="{{ 'assets/favicon/apple-touch-icon.png' | url }}">
  <link rel="manifest" href="{{ 'assets/favicon/site.webmanifest' | url }}">
  <style>
    [data-md-color-scheme="default"] .md-logo img[src$="#only-dark"],
    [data-md-color-scheme="slate"] .md-logo img[src$="#only-light"] { display: none }
  </style>
{% endblock %}
